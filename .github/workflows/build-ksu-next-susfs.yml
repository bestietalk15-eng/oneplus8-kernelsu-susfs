
name: Singularity Event Horizon - OnePlus 8 Pro Validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: singularity-event-horizon-validation
  cancel-in-progress: false

jobs:
  validate-and-build:
    name: Validate source, patches and kernel build
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      KERNEL_SOURCE: https://github.com/The-Anomalist/Singularity.git
      KERNEL_BRANCH: event-horizon
      DEVICE: instantnoodlep
      EXPECTED_ARCH: arm64
      OUT: out

    steps:
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache clang \
            flex git libelf-dev libssl-dev lld llvm \
            python3 python-is-python3 rsync unzip zip \
            zstd dwarves device-tree-compiler \
            patch curl file perl

      - name: Checkout exact Singularity source
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            --branch "$KERNEL_BRANCH" \
            --recurse-submodules \
            "$KERNEL_SOURCE" kernel

          cd kernel

          git checkout "$KERNEL_BRANCH"
          git submodule update --init --recursive

          test "$(git branch --show-current)" = "$KERNEL_BRANCH"

          git rev-parse HEAD | tee ../source-commit.txt
          git status --short | tee ../source-status.txt
          git submodule status | tee ../submodules.txt

          grep -q 'KernelSU-Next' .gitmodules || {
            echo "::error::Expected KernelSU-Next submodule is missing."
            exit 1
          }

          test -d KernelSU-Next
          test -f KernelSU-Next/Makefile || {
            echo "::error::KernelSU-Next checkout is incomplete."
            exit 1
          }

      - name: Inspect device support and kernel version
        shell: bash
        working-directory: kernel
        run: |
          set -euo pipefail

          mkdir -p ../artifacts

          {
            echo "Source: $KERNEL_SOURCE"
            echo "Branch: $KERNEL_BRANCH"
            echo "Device requested: OnePlus 8 Pro"
            echo "Device codename: $DEVICE"
            echo
            echo "Kernel version:"
            make kernelversion || true
            echo
            echo "Matching device and platform configurations:"
            find arch/arm64/configs -type f \
              \( -iname "*instantnoodlep*" \
                 -o -iname "*instantnoodle*" \
                 -o -iname "*kebab*" \
                 -o -iname "*kona*defconfig" \) \
              -print | sort
            echo
            echo "Device tree references:"
            grep -Ril \
              --exclude-dir=.git \
              --include='*.dts' \
              --include='*.dtsi' \
              'instantnoodlep' arch/arm64/boot/dts \
              2>/dev/null || true
          } | tee ../artifacts/device-audit.txt

          # Do not assume a shared SoC means shared device support.
          if ! grep -Ril \
            --exclude-dir=.git \
            --include='*defconfig' \
            'instantnoodlep' arch/arm64/configs \
            > ../artifacts/device-defconfig-matches.txt; then
            : > ../artifacts/device-defconfig-matches.txt
          fi

          if [ ! -s ../artifacts/device-defconfig-matches.txt ]; then
            echo "::warning::No explicitly named instantnoodlep defconfig found."
            echo "A verified device-specific configuration is required before packaging."
          fi

      - name: Verify existing KernelSU-Next integration
        shell: bash
        working-directory: kernel
        run: |
          set -euo pipefail

          {
            echo "KernelSU-Next submodule:"
            git submodule status -- KernelSU-Next
            echo
            echo "KernelSU-related build references:"
            grep -Rni \
              --exclude-dir=.git \
              --exclude='*.o' \
              --exclude='*.a' \
              -m 3 'KernelSU-Next' \
              Makefile Kbuild Kconfig \
              arch scripts security 2>/dev/null || true
          } | tee ../artifacts/kernelsu-audit.txt

          # Presence of a directory alone does not prove integration.
          if ! grep -Rqs \
            --exclude-dir=.git \
            --exclude='*.o' \
            --exclude='*.a' \
            'KernelSU-Next' \
            Makefile Kbuild Kconfig \
            arch scripts security 2>/dev/null; then
            echo "::error::Could not verify KernelSU-Next build integration."
            exit 1
          fi

      - name: Verify SUSFS patch inputs
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          # Never claim SUSFS is integrated just because a patch
          # repository or a directory exists.
          {
            echo "SUSFS integration audit"
            echo "Kernel source: $KERNEL_SOURCE"
            echo "Kernel branch: $KERNEL_BRANCH"
            echo
            echo "Checking for SUSFS implementation and patch references."

            cd kernel

            grep -Rni \
              --exclude-dir=.git \
              --exclude='*.o' \
              --exclude='*.a' \
              -m 5 'susfs' \
              fs include security Kconfig Makefile \
              2>/dev/null || true
          } | tee artifacts/susfs-audit.txt

          echo "SUSFS must be integrated using a compatible 4.19 patch set."
          echo "This workflow does not silently substitute another kernel or patch."
          echo "Patch application and config verification are mandatory before release."

      - name: Locate an explicit platform defconfig
        id: config
        shell: bash
        working-directory: kernel
        run: |
          set -euo pipefail

          # This is a platform candidate, NOT proof of OnePlus 8 Pro
          # compatibility. It is selected only for diagnostic building.
          if [ -f arch/arm64/configs/vendor/kona-perf_defconfig ]; then
            DEFCONFIG=vendor/kona-perf_defconfig
          elif [ -f arch/arm64/configs/kona-perf_defconfig ]; then
            DEFCONFIG=kona-perf_defconfig
          else
            echo "::error::No expected Kona platform defconfig found."
            echo "Review artifacts/device-audit.txt."
            exit 1
          fi

          echo "defconfig=$DEFCONFIG" >> "$GITHUB_OUTPUT"
          echo "Selected platform candidate: $DEFCONFIG"

      - name: Configure diagnostic kernel
        shell: bash
        working-directory: kernel
        run: |
          set -euo pipefail

          make O="$OUT" ARCH=arm64 \
            "$DEFCONFIG"

          # Preserve module-loading infrastructure. Do not blindly
          # convert every =m entry to =y: Kconfig dependencies and
          # device requirements must determine each driver's state.
          scripts/config --file "$OUT/.config" --enable MODULES

          make O="$OUT" ARCH=arm64 olddefconfig

          grep -qx 'CONFIG_MODULES=y' "$OUT/.config" || {
            echo "::error::LKM support is not enabled."
            exit 1
          }

          mkdir -p ../artifacts
          cp "$OUT/.config" ../artifacts/kernel.config

          grep -E '^CONFIG_[A-Za-z0-9_]+=m$' "$OUT/.config" \
            > ../artifacts/modular-options.txt || true

          grep -E '^CONFIG_(MODULES|KSU|KSU_SUSFS)=' \
            "$OUT/.config" \
            > ../artifacts/security-config.txt || true

      - name: Compile diagnostic kernel
        shell: bash
        working-directory: kernel
        run: |
          set -euo pipefail

          # First test the selected source/config/toolchain combination.
          # This is a diagnostic build until device support and SUSFS
          # have been independently verified.
          make -j"$(nproc)" \
            O="$OUT" \
            ARCH=arm64 \
            Image.gz dtbs modules

      - name: Validate diagnostic artifacts
        shell: bash
        working-directory: kernel
        run: |
          set -euo pipefail

          mkdir -p ../artifacts

          IMAGE="$OUT/arch/arm64/boot/Image.gz"

          test -s "$IMAGE" || {
            echo "::error::Image.gz is missing or empty."
            exit 1
          }

          file "$IMAGE" | tee ../artifacts/image-file.txt
          sha256sum "$IMAGE" | tee ../artifacts/image-sha256.txt
          cp "$IMAGE" ../artifacts/Image.gz

          # Record module output without pretending that these modules
          # are automatically compatible with every target ROM.
          MODULES_DIR="$OUT"
          find "$MODULES_DIR" -type f -name '*.ko' -print \
            | sort > ../artifacts/modules-list.txt

          git rev-parse HEAD > ../artifacts/kernel-commit.txt
          git submodule status > ../artifacts/submodules.txt

          {
            echo "Result: diagnostic build only"
            echo "Device: $DEVICE"
            echo "LKM infrastructure: checked"
            echo "SUSFS: not release-verified by this workflow"
            echo "Device boot test: not performed"
            echo "Flashable ZIP: intentionally not generated"
          } > ../artifacts/build-status.txt

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: singularity-event-horizon-validation
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
