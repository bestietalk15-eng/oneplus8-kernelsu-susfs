name: Build LOS24 Kernel with KernelSU-Next + SUSFS (Non-GKI)

on:
  workflow_dispatch:
    inputs:
      kernel_defconfig:
        description: 'Kernel defconfig (must exist in arch/arm64/configs)'
        required: true
        default: 'vendor/kona-perf_defconfig'
        type: string

permissions:
  contents: write

env:
  KERNEL_SOURCE: https://github.com/oplus-kona/android_kernel_oneplus_sm8250.git
  KERNEL_BRANCH: lineage-24.0
  SUSFS_SOURCE: https://gitlab.com/simonpunk/susfs4ksu.git
  SUSFS_BRANCH: kernel-4.19
  DEVICE_CODENAME: instantnoodlep
  ZIP_NAME: KSU-Next-SUSFS_OnePlus8Pro_instantnoodlep_LOS24.zip

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio curl flex git libelf-dev libssl-dev \
            lz4 make python3 python-is-python3 rsync zip unzip dwarves

      - name: Clone kernel source
        run: |
          set -euxo pipefail
          git clone --depth=1 --single-branch -b "$KERNEL_BRANCH" "$KERNEL_SOURCE" kernel
          test -f kernel/Makefile
          git -C kernel log -1 --oneline

      - name: Download Clang toolchain
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/toolchains/clang"
          curl --fail --location --retry 3 \
            'https://github.com/ZyCromerZ/Clang/releases/download/14.0.6-20250704-release/Clang-14.0.6-20250704.tar.gz' \
            -o /tmp/clang.tar.gz
          tar -xzf /tmp/clang.tar.gz -C "$GITHUB_WORKSPACE/toolchains/clang"
          test -x "$GITHUB_WORKSPACE/toolchains/clang/bin/clang"
          echo "$GITHUB_WORKSPACE/toolchains/clang/bin" >> "$GITHUB_PATH"
          "$GITHUB_WORKSPACE/toolchains/clang/bin/clang" --version

      - name: Clone SUSFS patches
        run: |
          set -euxo pipefail
          git clone --depth=1 --single-branch -b "$SUSFS_BRANCH" "$SUSFS_SOURCE" susfs4ksu
          test -f susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch
          test -f susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch
          test -f susfs4ksu/kernel_patches/fs/susfs.c
          test -f susfs4ksu/kernel_patches/include/linux/susfs.h

      - name: Integrate KernelSU-Next
        working-directory: kernel
        run: |
          set -euxo pipefail
          # The setup script expects drivers/kernelsu to be a symlink. If the
          # kernel tree already has a real directory there, preserve it first;
          # otherwise ln -sf can create a nested symlink instead of replacing it.
          if [ -d drivers/kernelsu ] && [ ! -L drivers/kernelsu ]; then
            backup="drivers/kernelsu.pre-ksun-${GITHUB_RUN_ID:-local}"
            echo "Existing drivers/kernelsu directory found; preserving it at $backup"
            mv drivers/kernelsu "$backup"
          fi
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh' \
            -o /tmp/ksu-setup.sh
          bash /tmp/ksu-setup.sh legacy
          echo 'KernelSU-Next symlink details:'
          ls -ld drivers/kernelsu
          KSU_REAL_DIR="$(readlink -f drivers/kernelsu)"
          echo "Resolved KernelSU-Next path: $KSU_REAL_DIR"
          test -d "$KSU_REAL_DIR"
          test -s "$KSU_REAL_DIR/Kconfig" || {
            echo 'KernelSU-Next Kconfig was not found at the resolved symlink target.' >&2
            find KernelSU-Next -maxdepth 3 -name Kconfig -print || true
            exit 1
          }

      - name: Add SUSFS source and apply kernel patch
        working-directory: kernel
        run: |
          set -euxo pipefail
          cp "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/fs/susfs.c" fs/
          cp "$GITHUB_WORKSPACE"/susfs4ksu/kernel_patches/include/linux/*.h include/linux/
          patch --batch --forward -p1 \
            < "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch"
          grep -q 'susfs.o' fs/Makefile || {
            echo 'SUSFS patch did not add susfs.o to fs/Makefile; refusing to guess the correct insertion point.' >&2
            exit 1
          }

      - name: Apply SUSFS patch to KernelSU-Next
        working-directory: kernel
        run: |
          set -euxo pipefail
          KSU_REAL_DIR="$(readlink -f drivers/kernelsu)"
          KSU_ROOT="$(dirname "$KSU_REAL_DIR")"
          test -d "$KSU_ROOT/kernel"
          cp "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" "$KSU_ROOT/"
          cd "$KSU_ROOT"
          patch --batch --forward -p1 < 10_enable_susfs_for_ksu.patch
          rm -f 10_enable_susfs_for_ksu.patch
          grep -R -n 'KSU_SUSFS' kernel/Kconfig

      - name: Configure kernel
        working-directory: kernel
        env:
          KERNEL_DEFCONFIG: ${{ inputs.kernel_defconfig }}
        run: |
          set -euxo pipefail
          test -f "arch/arm64/configs/$KERNEL_DEFCONFIG" || {
            echo "Defconfig not found: arch/arm64/configs/$KERNEL_DEFCONFIG" >&2
            find arch/arm64/configs -maxdepth 3 -type f -name '*kona*' -o -name '*instantnoodle*' | head -80
            exit 1
          }
          make O=out ARCH=arm64 "$KERNEL_DEFCONFIG"
          scripts/config --file out/.config -e KSU
          scripts/config --file out/.config -e KPROBES
          scripts/config --file out/.config -e KPROBE_EVENTS
          scripts/config --file out/.config -e KSU_KPROBE_HOOKS
          scripts/config --file out/.config -e KSU_SUSFS
          scripts/config --file out/.config -e KSU_SUSFS_SUS_PATH
          scripts/config --file out/.config -e KSU_SUSFS_SUS_MOUNT
          scripts/config --file out/.config -e KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT
          scripts/config --file out/.config -e KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT
          scripts/config --file out/.config -e KSU_SUSFS_SUS_KSTAT
          scripts/config --file out/.config -e KSU_SUSFS_TRY_UMOUNT
          scripts/config --file out/.config -e KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT
          scripts/config --file out/.config -e KSU_SUSFS_SPOOF_UNAME
          scripts/config --file out/.config -e KSU_SUSFS_ENABLE_LOG
          scripts/config --file out/.config -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
          scripts/config --file out/.config -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          scripts/config --file out/.config -e KSU_SUSFS_OPEN_REDIRECT
          scripts/config --file out/.config -e KALLSYMS
          scripts/config --file out/.config -e KALLSYMS_ALL
          make O=out ARCH=arm64 olddefconfig
          grep -E '^(CONFIG_(KSU|KPROBES|KPROBE_EVENTS|KSU_KPROBE_HOOKS|KSU_SUSFS))=' out/.config || true
          grep -q '^CONFIG_KSU=y' out/.config
          grep -q '^CONFIG_KPROBES=y' out/.config
          grep -q '^CONFIG_KSU_SUSFS=y' out/.config

      - name: Build kernel
        working-directory: kernel
        run: |
          set -euxo pipefail
          make -j"$(nproc --all)" O=out ARCH=arm64 \
            CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          test -s out/arch/arm64/boot/Image

      - name: Package AnyKernel3 ZIP
        run: |
          set -euxo pipefail
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          rm -rf AnyKernel3/.git
          cp kernel/out/arch/arm64/boot/Image AnyKernel3/Image
          test -f AnyKernel3/anykernel.sh
          # Set an explicit device check for the OnePlus 8 Pro codename.
          # Replace existing device.name entries rather than relying on a grep
          # that could match an unrelated comment or setting.
          if grep -qE '^device.name[0-9]*=' AnyKernel3/anykernel.sh; then
            sed -i -E '/^device.name[0-9]*=/d' AnyKernel3/anykernel.sh
          fi
          if grep -q '^do.devicecheck=' AnyKernel3/anykernel.sh; then
            sed -i 's/^do.devicecheck=.*/do.devicecheck=1;/' AnyKernel3/anykernel.sh
          else
            printf '\ndo.devicecheck=1;\n' >> AnyKernel3/anykernel.sh
          fi
          printf 'device.name1=instantnoodlep;\n' >> AnyKernel3/anykernel.sh
          grep -q '^do.devicecheck=1;' AnyKernel3/anykernel.sh
          grep -q '^device.name1=instantnoodlep;' AnyKernel3/anykernel.sh
          cd AnyKernel3
          zip -r9 "$GITHUB_WORKSPACE/$ZIP_NAME" . -x '.git/*' 'README.md' '*placeholder*'
          cp Image "$GITHUB_WORKSPACE/Image_OnePlus8Pro_LOS24_$(date -u +%Y%m%d)"

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus8Pro-LOS24-Kernel-Image
          path: Image_OnePlus8Pro_LOS24_*
          if-no-files-found: error
          retention-days: 14

      - name: Upload AnyKernel3 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ksu-next-susfs-los24-${{ github.run_number }}
          name: KernelSU-Next + SUSFS LOS24 Build ${{ github.run_number }}
          body: |
            Kernel build target: OnePlus 8 Pro (instantnoodlep)
            Kernel source: ${{ env.KERNEL_SOURCE }}
            Kernel branch: ${{ env.KERNEL_BRANCH }}

            This release contains a kernel image and an AnyKernel3 package.
            Successful compilation does not guarantee device boot compatibility.
          files: |
            ${{ env.ZIP_NAME }}
            Image_OnePlus8Pro_LOS24_*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
