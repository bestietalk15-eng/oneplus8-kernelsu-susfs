
name: Singularity OnePlus 8 Pro Kernel Build

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"

permissions:
  contents: read

concurrency:
  group: singularity-instantnoodlep-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Singularity for instantnoodlep
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      KERNEL_SOURCE: https://github.com/The-Anomalist/Singularity.git
      KERNEL_BRANCH: event-horizon
      DEVICE: instantnoodlep
      ARCH: arm64
      KERNEL_OUT: ${{ github.workspace }}/kernel-out
      MODULE_STAGING: ${{ github.workspace }}/module-staging

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ca-certificates \
            clang-14 lld-14 llvm-14 \
            flex git libelf-dev libssl-dev \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            make pahole perl python3 python3-pip \
            rsync tar xz-utils zstd \
            device-tree-compiler cpio

      - name: Clone exact kernel source and branch
        run: |
          set -euo pipefail

          git clone \
            --depth=1 \
            --single-branch \
            --branch "$KERNEL_BRANCH" \
            "$KERNEL_SOURCE" kernel

          cd kernel

          echo "Repository: $KERNEL_SOURCE"
          echo "Branch: $KERNEL_BRANCH"
          echo "Device target: $DEVICE"
          echo "Kernel commit: $(git rev-parse HEAD)"

          git status --short
          git log -1 --format='%H%n%s'

      - name: Verify existing KernelSU and audit SUSFS
        working-directory: kernel
        run: |
          set -euo pipefail

          echo "=== KernelSU source audit ==="

          if [ ! -d drivers/kernelsu ]; then
            echo "::error::Existing drivers/kernelsu was not found."
            echo "The expected KernelSU-Next integration is missing."
            exit 1
          fi

          find drivers/kernelsu -maxdepth 2 -type f \
            | head -100

          echo "=== SUSFS source audit ==="

          for path in \
            fs/susfs.c \
            include/linux/susfs.h \
            include/linux/susfs_def.h \
            drivers/kernelsu
          do
            if [ -e "$path" ]; then
              echo "Found: $path"
            fi
          done

          echo "=== SUSFS symbols and helper audit ==="

          git grep -n -E \
            'CONFIG_KSU_SUSFS|path_umount|get_cred_rcu|susfs' \
            -- '*Kconfig*' '*Makefile*' \
            'fs/*' 'include/linux/*' \
            'drivers/kernelsu/*' \
            > ../susfs-audit.txt || true

          cat ../susfs-audit.txt || true

          echo "No SUSFS patches will be applied automatically."
          echo "Existing source integration will be preserved."

      - name: Locate device-compatible defconfig
        id: config
        working-directory: kernel
        run: |
          set -euo pipefail

          candidates=(
            arch/arm64/configs/vendor/kona-perf_defconfig
            arch/arm64/configs/kona-perf_defconfig
            arch/arm64/configs/vendor/kona_defconfig
            arch/arm64/configs/kona_defconfig
            arch/arm64/configs/vendor/instantnoodlep_defconfig
            arch/arm64/configs/instantnoodlep_defconfig
          )

          selected=""

          for candidate in "${candidates[@]}"; do
            if [ -f "$candidate" ]; then
              selected="$candidate"
              break
            fi
          done

          if [ -z "$selected" ]; then
            echo "::error::No recognized Kona defconfig found."
            find arch/arm64/configs -type f \
              -name '*defconfig' | head -200
            exit 1
          fi

          echo "Selected defconfig: $selected"
          echo "defconfig=$selected" >> "$GITHUB_OUTPUT"

      - name: Configure kernel and enable LKM support
        working-directory: kernel
        env:
          DEFCONFIG: ${{ steps.config.outputs.defconfig }}
        run: |
          set -euo pipefail

          mkdir -p "$KERNEL_OUT"

          make O="$KERNEL_OUT" \
            ARCH=arm64 \
            LLVM=-14 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            "$DEFCONFIG"

          scripts/config --file "$KERNEL_OUT/.config" \
            --enable MODULES \
            --enable KALLSYMS \
            --enable KALLSYMS_ALL \
            --enable KPROBES \
            --enable KSU

          make O="$KERNEL_OUT" \
            ARCH=arm64 \
            LLVM=-14 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

          echo "=== Required configuration ==="
          grep -E \
            '^(CONFIG_MODULES|CONFIG_KALLSYMS|CONFIG_KALLSYMS_ALL|CONFIG_KPROBES|CONFIG_KSU)=' \
            "$KERNEL_OUT/.config" || true

          if ! grep -qx 'CONFIG_MODULES=y' "$KERNEL_OUT/.config"; then
            echo "::error::CONFIG_MODULES=y did not survive olddefconfig."
            exit 1
          fi

          if ! grep -qx 'CONFIG_KSU=y' "$KERNEL_OUT/.config"; then
            echo "::error::CONFIG_KSU=y is missing."
            echo "Inspect the existing KernelSU Kconfig integration."
            exit 1
          fi

          cp "$KERNEL_OUT/.config" ../kernel-config.txt

      - name: Audit SUSFS kernel configuration
        working-directory: kernel
        run: |
          set -euo pipefail

          echo "=== Available SUSFS Kconfig declarations ==="

          git grep -n -E \
            '^[[:space:]]*(menuconfig|config)[[:space:]].*(SUSFS|SUS)' \
            -- '*Kconfig*' || true

          echo "=== Active SUSFS configuration ==="

          grep -i 'SUSFS\|SUS_' "$KERNEL_OUT/.config" \
            || true

          echo "=== Compatibility helper definitions ==="

          git grep -n -E \
            'path_umount|get_cred_rcu' \
            -- fs include drivers/kernelsu \
            || true

          echo "Audit only: no SUSFS symbol is forced on"
          echo "unless its actual Kconfig definition is verified."

      - name: Diagnose and fix Qualcomm charger header ordering
        working-directory: kernel
        run: |
          set -euo pipefail

          SRC="drivers/power/supply/qcom/schgm-flash.c"
          HDR="drivers/power/supply/qcom/schgm-flash.h"
          LIB="drivers/power/supply/qcom/smb5-lib.h"

          if [ ! -f "$SRC" ]; then
            echo "::error::Expected Qualcomm source not found: $SRC"
            exit 1
          fi

          echo "=== Existing source includes ==="
          sed -n '1,180p' "$SRC"

          echo "=== Charger API definitions in this source tree ==="

          git grep -n -E \
            'struct smb_charger|struct smb_irq_data|smblib_read[[:space:]]*\\(|smblib_write[[:space:]]*\\(|smblib_masked_write[[:space:]]*\\(' \
            -- drivers/power/supply/qcom include/linux \
            > ../charger-api-audit.txt || true

          cat ../charger-api-audit.txt || true

          if grep -q 'struct smb_charger' "$SRC" &&
             grep -q 'struct smb_irq_data' "$SRC"; then
            echo "Inspecting required API declarations."

            if [ ! -f "$LIB" ]; then
              echo "::error::smb5-lib.h does not exist at the expected path."
              echo "Cannot safely apply the proposed header fix."
              exit 1
            fi

            if ! grep -q 'struct smb_charger' "$LIB"; then
              echo "::error::smb5-lib.h does not declare smb_charger."
              exit 1
            fi

            if ! grep -qE 'struct smb_irq_data' "$LIB"; then
              echo "::warning::smb_irq_data was not found in smb5-lib.h."
              echo "The complete API audit is available in the artifacts."
            fi

            python3 - <<'PY'
          from pathlib import Path

          source = Path("drivers/power/supply/qcom/schgm-flash.c")
          text = source.read_text()
          include = '#include "smb5-lib.h"'

          if include not in text:
              target = '#include "schgm-flash.h"'

              if target not in text:
                  raise SystemExit(
                      "Cannot safely insert smb5-lib.h: "
                      "the expected schgm-flash.h include was not found."
                  )

              text = text.replace(
                  target,
                  include + "\n" + target,
                  1
              )
              source.write_text(text)
              print("Added smb5-lib.h before schgm-flash.h.")
          else:
              print("smb5-lib.h is already included.")
          PY
          fi

          echo "=== Resulting include order ==="
          sed -n '1,100p' "$SRC"

      - name: Build kernel image, device trees and modules
        working-directory: kernel
        run: |
          set -euo pipefail

          THREADS="$(nproc)"
          echo "Build jobs: $THREADS"

          make -j"$THREADS" \
            O="$KERNEL_OUT" \
            ARCH=arm64 \
            LLVM=-14 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image.gz dtbs modules \
            2>&1 | tee ../kernel-build.log

      - name: Stage compiled loadable modules
        if: success()
        working-directory: kernel
        run: |
          set -euo pipefail

          mkdir -p "$MODULE_STAGING"

          make \
            O="$KERNEL_OUT" \
            ARCH=arm64 \
            LLVM=-14 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            INSTALL_MOD_PATH="$MODULE_STAGING" \
            modules_install

          echo "=== Compiled module files ==="

          find "$MODULE_STAGING" -type f -name '*.ko' \
            -print | tee ../module-list.txt

          if ! grep -q '\.ko$' ../module-list.txt; then
            echo "::warning::No loadable .ko files were produced."
            echo "This can be normal if every enabled driver is built in."
          fi

      - name: Collect build diagnostics and artifacts
        if: always()
        run: |
          set -u

          mkdir -p artifacts

          if [ -f kernel/.config ]; then
            cp kernel/.config artifacts/kernel.config
          fi

          if [ -f kernel-config.txt ]; then
            cp kernel-config.txt artifacts/kernel-config.txt
          fi

          if [ -f kernel-build.log ]; then
            cp kernel-build.log artifacts/
          fi

          if [ -f charger-api-audit.txt ]; then
            cp charger-api-audit.txt artifacts/
          fi

          if [ -f susfs-audit.txt ]; then
            cp susfs-audit.txt artifacts/
          fi

          if [ -f module-list.txt ]; then
            cp module-list.txt artifacts/
          fi

          if [ -d kernel-out/arch/arm64/boot ]; then
            mkdir -p artifacts/boot

            for file in \
              kernel-out/arch/arm64/boot/Image \
              kernel-out/arch/arm64/boot/Image.gz \
              kernel-out/arch/arm64/boot/Image.gz-dtb
            do
              if [ -f "$file" ]; then
                cp "$file" artifacts/boot/
              fi
            done

            if [ -d kernel-out/arch/arm64/boot/dts ]; then
              tar -czf artifacts/device-trees.tar.gz \
                -C kernel-out/arch/arm64/boot dts
            fi
          fi

          if [ -d module-staging ]; then
            tar -czf artifacts/loadable-modules.tar.gz \
              -C module-staging .
          fi

          if [ -d kernel-out ]; then
            find kernel-out -name '*.ko' -type f \
              -exec cp --parents '{}' artifacts/ \; \
              2>/dev/null || true
          fi

          {
            echo "Repository: $KERNEL_SOURCE"
            echo "Branch: $KERNEL_BRANCH"
            echo "Device target: $DEVICE"
            if [ -d kernel/.git ]; then
              echo "Commit: $(git -C kernel rev-parse HEAD)"
            fi
            echo "LKM requested: CONFIG_MODULES=y"
            echo "Flashable ZIP: not generated"
            echo "Reason: device compatibility and installation layout"
            echo "must be verified before packaging."
          } > artifacts/build-summary.txt

      - name: Upload kernel build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: singularity-instantnoodlep-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
