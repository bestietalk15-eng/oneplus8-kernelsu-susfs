
name: Build Singularity Kernel with KernelSU-Next and SUSFS

on:
  workflow_dispatch:
    inputs:
      build_modules:
        description: "Build and archive loadable kernel modules"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  KERNEL_SOURCE: https://github.com/The-Anomalist/Singularity.git
  KERNEL_BRANCH: event-horizon
  SUSFS_SOURCE: https://gitlab.com/simonpunk/susfs4ksu.git
  SUSFS_BRANCH: kernel-4.19
  DEVICE_CODENAME: instantnoodlep
  KERNEL_OUT: kernel-out

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio curl flex git \
            libelf-dev libssl-dev lz4 make python3 \
            python-is-python3 rsync zip unzip dwarves patch \
            clang llvm lld gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

      - name: Clone exact kernel source and branch
        shell: bash
        run: |
          set -euxo pipefail

          git clone --recurse-submodules --single-branch \
            --branch "$KERNEL_BRANCH" \
            "$KERNEL_SOURCE" kernel

          test -s kernel/Makefile

          test "$(git -C kernel branch --show-current)" \
            = "$KERNEL_BRANCH"

          {
            echo "Kernel source: $KERNEL_SOURCE"
            echo "Kernel branch: $(git -C kernel branch --show-current)"
            echo "Kernel commit: $(git -C kernel rev-parse HEAD)"
            echo "Submodule status:"
            git -C kernel submodule status --recursive || true
          } | tee "$GITHUB_WORKSPACE/source-info.txt"

      - name: Verify existing KernelSU-Next integration
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          if [ -L drivers/kernelsu ]; then
            test -e drivers/kernelsu
            KSU_DIR="$(readlink -f drivers/kernelsu)"
          elif [ -d drivers/kernelsu ]; then
            KSU_DIR="drivers/kernelsu"
          else
            echo "::error::Existing drivers/kernelsu integration not found."
            echo "Refusing to clone or install a different KernelSU tree."
            exit 1
          fi

          test -s "$KSU_DIR/Kconfig"
          test -s "$KSU_DIR/Makefile"

          echo "KernelSU directory: $KSU_DIR"

          find "$KSU_DIR" -maxdepth 3 -type f \
            \( -iname '*susfs*' -o -name Kconfig \) \
            -print | head -100

      - name: Fetch SUSFS kernel-4.19 patches
        shell: bash
        run: |
          set -euxo pipefail

          git clone --depth=1 --single-branch \
            --branch "$SUSFS_BRANCH" \
            "$SUSFS_SOURCE" susfs4ksu

          test -s \
            susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch

          test -s \
            susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch

          test -s susfs4ksu/kernel_patches/fs/susfs.c
          test -s susfs4ksu/kernel_patches/include/linux/susfs.h

      - name: Apply SUSFS kernel patch safely
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          PATCH="$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch"
          DIAG="$GITHUB_WORKSPACE/susfs-diagnostics"

          mkdir -p "$DIAG"

          {
            echo "Kernel commit: $(git rev-parse HEAD)"
            echo "Kernel branch: $(git branch --show-current)"
            echo "SUSFS branch: $SUSFS_BRANCH"
            echo "Patch: $PATCH"
          } | tee "$DIAG/diagnostics.txt"

          if ! patch --batch --forward --dry-run -p1 \
              < "$PATCH" > "$DIAG/kernel-patch-dry-run.log" 2>&1; then

            cat "$DIAG/kernel-patch-dry-run.log"

            {
              echo "SUSFS patch dry-run failed. No patch was applied."

              for f in \
                fs/namespace.c \
                fs/proc/task_mmu.c \
                include/linux/mount.h \
                include/linux/cred.h \
                fs/internal.h; do

                if [ -f "$f" ]; then
                  echo "===== $f ====="
                  grep -n -E \
                    'path_umount|get_cred_rcu|susfs|struct path|struct cred' \
                    "$f" | head -100 || true
                fi
              done
            } >> "$DIAG/diagnostics.txt"

            echo "::error::SUSFS patch is incompatible with this source revision."
            echo "Review the SUSFS-patch-diagnostics artifact."
            exit 1
          fi

          patch --batch --forward -p1 < "$PATCH"

          cp \
            "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/fs/susfs.c" \
            fs/susfs.c

          install -m 0644 \
            "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/include/linux/susfs.h" \
            include/linux/susfs.h

          grep -q 'susfs.o' fs/Makefile || {
            echo "::error::fs/Makefile does not reference susfs.o."
            exit 1
          }

          if find . -type f -name '*.rej' -print -quit | grep -q .; then
            find . -type f -name '*.rej' -print
            echo "::error::Rejected patch files remain."
            exit 1
          fi

      - name: Apply SUSFS patch to existing KernelSU-Next
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          KSU_PATCH="$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"

          if [ -L drivers/kernelsu ]; then
            KSU_DIR="$(readlink -f drivers/kernelsu)"
          else
            KSU_DIR="$GITHUB_WORKSPACE/kernel/drivers/kernelsu"
          fi

          KSU_ROOT="$(
            git -C "$KSU_DIR" rev-parse --show-toplevel 2>/dev/null \
              || dirname "$KSU_DIR"
          )"

          mkdir -p "$GITHUB_WORKSPACE/susfs-diagnostics"

          if patch --batch --forward --dry-run \
              -d "$KSU_ROOT" -p1 \
              < "$KSU_PATCH" \
              > "$GITHUB_WORKSPACE/susfs-diagnostics/ksu-patch-dry-run.log" 2>&1; then

            patch --batch --forward \
              -d "$KSU_ROOT" -p1 < "$KSU_PATCH"
          else
            cat "$GITHUB_WORKSPACE/susfs-diagnostics/ksu-patch-dry-run.log"
            echo "::error::SUSFS patch does not match this KernelSU-Next tree."
            exit 1
          fi

      - name: Fix Qualcomm charger header dependency
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          SRC="drivers/power/supply/qcom/schgm-flash.c"
          HDR="drivers/power/supply/qcom/schgm-flash.h"
          LIB="drivers/power/supply/qcom/smb5-lib.h"
          DIAG="$GITHUB_WORKSPACE/susfs-diagnostics"

          mkdir -p "$DIAG"

          test -s "$SRC" || {
            echo "::error::schgm-flash.c is missing."
            exit 1
          }

          test -s "$HDR" || {
            echo "::error::schgm-flash.h is missing."
            exit 1
          }

          test -s "$LIB" || {
            echo "::error::smb5-lib.h is missing."
            exit 1
          }

          {
            echo "Before fix: $SRC"
            sed -n '1,45p' "$SRC"
          } | tee "$DIAG/schgm-flash-header-fix.log"

          python3 - <<'PY'
          from pathlib import Path
          import re

          src = Path("drivers/power/supply/qcom/schgm-flash.c")
          hdr = Path("drivers/power/supply/qcom/schgm-flash.h")
          lib = Path("drivers/power/supply/qcom/smb5-lib.h")

          source = src.read_text()
          header = hdr.read_text()
          library_header = lib.read_text()

          # The implementation uses smb_charger, smb_irq_data,
          # smblib_read() and smblib_write(). Include the API header
          # before schgm-flash.h so the definitions are available.

          if not re.search(
              r'^\s*#\s*include\s*[<"]smb5-lib\.h[">]',
              source,
              re.M
          ):
              matches = list(re.finditer(
                  r'^\s*#\s*include\s*[<"]schgm-flash\.h[">]\s*$',
                  source,
                  re.M
              ))

              if len(matches) != 1:
                  raise SystemExit(
                      'Expected exactly one schgm-flash.h include; '
                      'refusing an ambiguous source edit.'
                  )

              match = matches[0]
              source = (
                  source[:match.start()]
                  + '#include "smb5-lib.h"\n'
                  + source[match.start():]
              )
              src.write_text(source)

          # Keep the public header safe to include independently.
          if not re.search(
              r'^\s*struct\s+smb_charger\s*;',
              header,
              re.M
          ):
              guard = re.search(
                  r'^\s*#\s*define\s+\w+',
                  header,
                  re.M
              )

              if not guard:
                  raise SystemExit(
                      'Could not identify schgm-flash.h include guard.'
                  )

              pos = guard.end()
              header = (
                  header[:pos]
                  + '\n\nstruct smb_charger;\n'
                  + header[pos:]
              )
              hdr.write_text(header)

          # Fail rather than silently continue if the expected API
          # declarations are absent from this kernel's own header.
          required = [
              "struct smb_charger",
              "struct smb_irq_data",
              "smblib_read",
              "smblib_write",
          ]

          missing = [
              symbol for symbol in required
              if symbol not in library_header
          ]

          if missing:
              raise SystemExit(
                  "smb5-lib.h lacks expected symbols: "
                  + ", ".join(missing)
              )

          print("Verified smb5-lib.h and applied guarded header fix.")
          PY

          grep -n 'smb5-lib.h' "$SRC"
          grep -n 'struct smb_charger;' "$HDR"

          {
            echo "After fix: $SRC"
            sed -n '1,45p' "$SRC"
          } | tee -a "$DIAG/schgm-flash-header-fix.log"

      - name: Select and configure kernel defconfig
        id: config
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          DEFCONFIG=""

          for candidate in \
            arch/arm64/configs/vendor/kona-perf_defconfig \
            arch/arm64/configs/kona-perf_defconfig \
            arch/arm64/configs/vendor/kona_defconfig \
            arch/arm64/configs/kona_defconfig \
            arch/arm64/configs/vendor/instantnoodlep_defconfig \
            arch/arm64/configs/instantnoodlep_defconfig; do

            if [ -s "$candidate" ]; then
              DEFCONFIG="$candidate"
              break
            fi
          done

          if [ -z "$DEFCONFIG" ]; then
            echo "::error::No supported Kona/instantnoodle defconfig found."
            find arch/arm64/configs -maxdepth 4 -type f \
              \( -iname '*kona*' -o -iname '*instantnoodle*' \) \
              -print | head -150
            exit 1
          fi

          DEFCONFIG_NAME="${DEFCONFIG#arch/arm64/configs/}"

          echo "Selected defconfig: $DEFCONFIG"
          echo "defconfig=$DEFCONFIG_NAME" >> "$GITHUB_OUTPUT"

          mkdir -p "$KERNEL_OUT"

          make O="$KERNEL_OUT" ARCH=arm64 LLVM=1 "$DEFCONFIG_NAME"

          scripts/config --file "$KERNEL_OUT/.config" \
            -e MODULES \
            -e KALLSYMS \
            -e KALLSYMS_ALL \
            -e KPROBES \
            -e KSU

          make O="$KERNEL_OUT" ARCH=arm64 LLVM=1 olddefconfig

          grep -q '^CONFIG_MODULES=y' "$KERNEL_OUT/.config" || {
            echo "::error::CONFIG_MODULES=y is required for LKM support."
            exit 1
          }

          grep -q '^CONFIG_KSU=y' "$KERNEL_OUT/.config" || {
            echo "::error::CONFIG_KSU=y did not survive olddefconfig."
            exit 1
          }

          {
            echo "Defconfig: $DEFCONFIG"
            echo "Kernel commit: $(git rev-parse HEAD)"
            echo "Requested device codename: $DEVICE_CODENAME"
            grep -E \
              '^CONFIG_(MODULES|KSU|KPROBES|KSU_SUSFS)=' \
              "$KERNEL_OUT/.config" || true
          } | tee "$GITHUB_WORKSPACE/kernel-config-summary.txt"

          cp "$KERNEL_OUT/.config" "$GITHUB_WORKSPACE/kernel.config"

      - name: Build kernel image, device trees, and optional modules
        working-directory: kernel
        env:
          DEFCONFIG: ${{ steps.config.outputs.defconfig }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$DEFCONFIG" || {
            echo "::error::DEFCONFIG output is empty."
            exit 1
          }

          echo "Building configured target: $DEFCONFIG"

          make -j"$(nproc --all)" \
            O="$KERNEL_OUT" ARCH=arm64 \
            CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image.gz dtbs

          test -s "$KERNEL_OUT/arch/arm64/boot/Image.gz" || {
            echo "::error::Image.gz was not produced."
            find "$KERNEL_OUT/arch/arm64/boot" \
              -maxdepth 2 -type f -print || true
            exit 1
          }

          if [ "${{ inputs.build_modules }}" = "true" ]; then
            make -j"$(nproc --all)" \
              O="$KERNEL_OUT" ARCH=arm64 \
              CC=clang LLVM=1 LLVM_IAS=1 \
              CROSS_COMPILE=aarch64-linux-gnu- \
              CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
              modules

            mkdir -p "$GITHUB_WORKSPACE/module-staging"

            make O="$KERNEL_OUT" ARCH=arm64 \
              CC=clang LLVM=1 LLVM_IAS=1 \
              CROSS_COMPILE=aarch64-linux-gnu- \
              CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
              INSTALL_MOD_PATH="$GITHUB_WORKSPACE/module-staging" \
              modules_install

            find "$GITHUB_WORKSPACE/module-staging" \
              -type f -name '*.ko' -print
          fi

      - name: Collect build artifacts and diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          cp -f source-info.txt artifacts/ 2>/dev/null || true
          cp -f kernel-config-summary.txt artifacts/ 2>/dev/null || true
          cp -f kernel.config artifacts/ 2>/dev/null || true

          if [ -s "kernel/$KERNEL_OUT/.config" ]; then
            cp "kernel/$KERNEL_OUT/.config" \
              artifacts/final-kernel.config
          fi

          if [ -s "kernel/$KERNEL_OUT/arch/arm64/boot/Image.gz" ]; then
            cp "kernel/$KERNEL_OUT/arch/arm64/boot/Image.gz" artifacts/
          fi

          if [ -s "kernel/$KERNEL_OUT/arch/arm64/boot/Image" ]; then
            cp "kernel/$KERNEL_OUT/arch/arm64/boot/Image" artifacts/
          fi

          if [ -d "kernel/$KERNEL_OUT/arch/arm64/boot/dts" ]; then
            tar -czf artifacts/dtbs.tar.gz \
              -C "kernel/$KERNEL_OUT/arch/arm64/boot" dts
          fi

          if [ -d module-staging ]; then
            tar -czf artifacts/modules.tar.gz \
              -C module-staging .
          fi

          if [ -d susfs-diagnostics ]; then
            cp -a susfs-diagnostics artifacts/
          fi

      - name: Upload build artifacts and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Singularity-event-horizon-build-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
