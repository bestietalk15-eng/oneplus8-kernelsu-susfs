
name: Singularity Event Horizon Kernel Build

on:
  workflow_dispatch:
    inputs:
      build_modules:
        description: "Build loadable kernel modules (.ko)"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  KERNEL_SOURCE: https://github.com/The-Anomalist/Singularity.git
  KERNEL_BRANCH: event-horizon
  DEVICE_CODENAME: instantnoodlep
  KERNEL_OUT: out

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio curl flex git \
            libelf-dev libssl-dev lz4 make python3 \
            python-is-python3 rsync zip unzip dwarves patch \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Download Clang toolchain
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/clang"

          curl --fail --location --retry 3 \
            'https://github.com/ZyCromerZ/Clang/releases/download/14.0.6-20250704-release/Clang-14.0.6-20250704.tar.gz' \
            -o "$RUNNER_TEMP/clang.tar.gz"

          tar -xzf "$RUNNER_TEMP/clang.tar.gz" \
            -C "$RUNNER_TEMP/clang"

          test -x "$RUNNER_TEMP/clang/bin/clang"
          echo "$RUNNER_TEMP/clang/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/clang/bin/clang" --version

      - name: Clone exact Singularity source
        shell: bash
        run: |
          set -euxo pipefail

          git clone --recurse-submodules --single-branch \
            --branch "$KERNEL_BRANCH" "$KERNEL_SOURCE" kernel

          test -s kernel/Makefile

          {
            echo "Source: $KERNEL_SOURCE"
            echo "Branch: $(git -C kernel branch --show-current)"
            echo "Commit: $(git -C kernel rev-parse HEAD)"
            echo "Submodules:"
            git -C kernel submodule status --recursive || true
          } | tee "$GITHUB_WORKSPACE/source-info.txt"

      - name: Verify existing KernelSU-Next integration
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          if [ -L drivers/kernelsu ]; then
            test -e drivers/kernelsu
            KSU_DIR="$(readlink -f drivers/kernelsu)"
          elif [ -d drivers/kernelsu ]; then
            KSU_DIR="drivers/kernelsu"
          else
            echo "::error::Existing drivers/kernelsu integration not found."
            echo "This workflow will not install a second KernelSU tree."
            exit 1
          fi

          test -s "$KSU_DIR/Kconfig"
          test -s "$KSU_DIR/Makefile"

          echo "KernelSU directory: $KSU_DIR"
          grep -R -n -E \
            'config KSU|KSU_SUSFS|SUSFS' \
            "$KSU_DIR" \
            --include='Kconfig' \
            --include='Makefile' \
            --include='*.c' \
            --include='*.h' \
            2>/dev/null | head -200 || true

      - name: Audit existing SUSFS integration without patching
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/diagnostics"

          {
            echo "===== Source revision ====="
            git log -1 --oneline

            echo "===== Existing SUSFS files ====="
            find fs include drivers -type f \
              \( -iname '*susfs*' \) \
              -print 2>/dev/null | head -200

            echo "===== SUSFS source references ====="
            git grep -n -i susfs -- \
              fs include/linux kernel drivers/kernelsu \
              2>/dev/null | head -300 || true

            echo "===== Filesystem build integration ====="
            grep -n -i susfs fs/Makefile fs/Kconfig \
              2>/dev/null || true

            echo "===== Existing KernelSU SUSFS references ====="
            grep -R -n -i susfs drivers/kernelsu \
              --include='Kconfig' \
              --include='Makefile' \
              --include='*.c' \
              --include='*.h' \
              2>/dev/null | head -200 || true
          } | tee "$GITHUB_WORKSPACE/diagnostics/susfs-audit.txt"

          echo "Audit only: no SUSFS patches have been downloaded or applied."

      - name: Check Qualcomm charger headers
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          SRC="drivers/power/supply/qcom/schgm-flash.c"
          HDR="drivers/power/supply/qcom/schgm-flash.h"
          LIB="drivers/power/supply/qcom/smb5-lib.h"

          test -s "$SRC"
          test -s "$HDR"
          test -s "$LIB"

          {
            echo "===== Current schgm-flash.c ====="
            sed -n '1,100p' "$SRC"

            echo "===== Charger declarations ====="
            grep -R -n -E \
              'struct smb_charger|struct smb_irq_data|smblib_read|smblib_write' \
              drivers/power/supply/qcom \
              --include='*.h' --include='*.c' \
              | head -200 || true
          } | tee "$GITHUB_WORKSPACE/diagnostics/charger-headers.txt"

          python3 - <<'PY'
          from pathlib import Path
          import re

          src = Path("drivers/power/supply/qcom/schgm-flash.c")
          hdr = Path("drivers/power/supply/qcom/schgm-flash.h")
          lib = Path("drivers/power/supply/qcom/smb5-lib.h")

          source = src.read_text()
          header = hdr.read_text()
          lib_text = lib.read_text()

          # Verify that the charger API declarations exist somewhere
          # in this source tree before attempting the include adjustment.
          root = Path("drivers/power/supply/qcom")
          all_headers = "\n".join(
              p.read_text(errors="ignore")
              for p in root.rglob("*.h")
          )

          required = [
              "struct smb_charger",
              "struct smb_irq_data",
              "smblib_read",
              "smblib_write",
          ]

          missing = [
              item for item in required
              if item not in all_headers and item not in lib_text
          ]

          if missing:
              raise SystemExit(
                  "Expected Qualcomm declarations were not found: "
                  + ", ".join(missing)
                  + ". No speculative compatibility edit was made."
              )

          # Include smb5-lib.h before schgm-flash.h, so the charger
          # API declarations are visible when schgm-flash.h is parsed.
          if not re.search(
              r'^\s*#\s*include\s*[<"]smb5-lib\.h[">]',
              source,
              re.M
          ):
              matches = list(re.finditer(
                  r'^\s*#\s*include\s*[<"]schgm-flash\.h[">]\s*$',
                  source,
                  re.M
              ))

              if len(matches) != 1:
                  raise SystemExit(
                      "Could not uniquely locate schgm-flash.h include. "
                      "No speculative source edit was made."
                  )

              match = matches[0]
              source = (
                  source[:match.start()]
                  + '#include "smb5-lib.h"\n'
                  + source[match.start():]
              )
              src.write_text(source)

          # A pointer parameter can use a forward declaration.
          # Do not add it if the header already has one.
          if not re.search(
              r'^\s*struct\s+smb_charger\s*;',
              header,
              re.M
          ):
              guard = re.search(
                  r'^\s*#\s*define\s+\w+',
                  header,
                  re.M
              )

              if not guard:
                  raise SystemExit(
                      "Cannot identify schgm-flash.h include guard."
                  )

              pos = guard.end()
              header = (
                  header[:pos]
                  + "\n\nstruct smb_charger;\n"
                  + header[pos:]
              )
              hdr.write_text(header)

          print("Charger header checks completed.")
          PY

          {
            echo "===== Resulting source includes ====="
            sed -n '1,55p' "$SRC"
          } | tee -a "$GITHUB_WORKSPACE/diagnostics/charger-headers.txt"

      - name: Locate and configure defconfig
        id: config
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          DEFCONFIG=""

          for candidate in \
            arch/arm64/configs/vendor/kona-perf_defconfig \
            arch/arm64/configs/kona-perf_defconfig \
            arch/arm64/configs/vendor/kona_defconfig \
            arch/arm64/configs/kona_defconfig \
            arch/arm64/configs/vendor/instantnoodlep_defconfig \
            arch/arm64/configs/instantnoodlep_defconfig; do

            if [ -s "$candidate" ]; then
              DEFCONFIG="$candidate"
              break
            fi
          done

          if [ -z "$DEFCONFIG" ]; then
            echo "::error::No supported defconfig candidate was found."
            find arch/arm64/configs -maxdepth 4 -type f \
              \( -iname '*kona*' -o -iname '*instantnoodle*' \) \
              -print | head -150
            exit 1
          fi

          DEFCONFIG_NAME="${DEFCONFIG#arch/arm64/configs/}"
          echo "Selected defconfig: $DEFCONFIG"
          echo "defconfig=$DEFCONFIG_NAME" >> "$GITHUB_OUTPUT"

          mkdir -p "$KERNEL_OUT"

          make O="$KERNEL_OUT" ARCH=arm64 LLVM=1 \
            "$DEFCONFIG_NAME"

          scripts/config --file "$KERNEL_OUT/.config" \
            -e MODULES \
            -e KALLSYMS \
            -e KALLSYMS_ALL \
            -e KPROBES \
            -e KSU

          make O="$KERNEL_OUT" ARCH=arm64 LLVM=1 olddefconfig

          grep -q '^CONFIG_MODULES=y' "$KERNEL_OUT/.config" || {
            echo "::error::CONFIG_MODULES=y is required for LKM support."
            exit 1
          }

          grep -q '^CONFIG_KSU=y' "$KERNEL_OUT/.config" || {
            echo "::error::CONFIG_KSU=y is not enabled."
            exit 1
          }

          {
            echo "Defconfig: $DEFCONFIG"
            echo "Commit: $(git rev-parse HEAD)"
            echo "Device requested: $DEVICE_CODENAME"
            echo "===== Important config ====="
            grep -E \
              '^CONFIG_(MODULES|KSU|KPROBES|KSU_SUSFS)=' \
              "$KERNEL_OUT/.config" || true
            echo "===== SUSFS-related config ====="
            grep -i susfs "$KERNEL_OUT/.config" || true
          } | tee "$GITHUB_WORKSPACE/kernel-config-summary.txt"

          cp "$KERNEL_OUT/.config" \
            "$GITHUB_WORKSPACE/kernel.config"

      - name: Validate existing SUSFS configuration
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          if grep -q '^CONFIG_KSU_SUSFS=y' "$KERNEL_OUT/.config"; then
            echo "CONFIG_KSU_SUSFS=y"
          else
            echo "::error::CONFIG_KSU_SUSFS=y is not enabled in the final config."
            echo "This workflow will not add SUSFS patches to compensate."
            echo "Inspect kernel-config-summary.txt and susfs-audit.txt."
            exit 1
          fi

      - name: Build kernel image and device trees
        working-directory: kernel
        env:
          DEFCONFIG: ${{ steps.config.outputs.defconfig }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$DEFCONFIG" || {
            echo "::error::DEFCONFIG output is empty."
            exit 1
          }

          make -j"$(nproc --all)" \
            O="$KERNEL_OUT" ARCH=arm64 \
            CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image.gz dtbs

          test -s "$KERNEL_OUT/arch/arm64/boot/Image.gz" || {
            echo "::error::Image.gz was not produced."
            find "$KERNEL_OUT/arch/arm64/boot" \
              -maxdepth 3 -type f -print || true
            exit 1
          }

          if [ -s "$KERNEL_OUT/arch/arm64/boot/Image" ]; then
            echo "Uncompressed Image also produced."
          fi

      - name: Build and stage loadable modules
        if: ${{ inputs.build_modules }}
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          grep -q '^CONFIG_MODULES=y' "$KERNEL_OUT/.config"

          make -j"$(nproc --all)" \
            O="$KERNEL_OUT" ARCH=arm64 \
            CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            modules

          mkdir -p "$GITHUB_WORKSPACE/module-staging"

          make O="$KERNEL_OUT" ARCH=arm64 \
            CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            INSTALL_MOD_PATH="$GITHUB_WORKSPACE/module-staging" \
            modules_install

          find "$GITHUB_WORKSPACE/module-staging" \
            -type f -name '*.ko' -print \
            | tee "$GITHUB_WORKSPACE/diagnostics/modules-list.txt"

      - name: Collect artifacts and diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          cp -f source-info.txt artifacts/ 2>/dev/null || true
          cp -f kernel-config-summary.txt artifacts/ 2>/dev/null || true
          cp -f kernel.config artifacts/ 2>/dev/null || true

          if [ -s "kernel/$KERNEL_OUT/.config" ]; then
            cp "kernel/$KERNEL_OUT/.config" \
              artifacts/final-kernel.config
          fi

          if [ -s "kernel/$KERNEL_OUT/arch/arm64/boot/Image.gz" ]; then
            cp "kernel/$KERNEL_OUT/arch/arm64/boot/Image.gz" artifacts/
          fi

          if [ -s "kernel/$KERNEL_OUT/arch/arm64/boot/Image" ]; then
            cp "kernel/$KERNEL_OUT/arch/arm64/boot/Image" artifacts/
          fi

          if [ -d "kernel/$KERNEL_OUT/arch/arm64/boot/dts" ]; then
            tar -czf artifacts/dtbs.tar.gz \
              -C "kernel/$KERNEL_OUT/arch/arm64/boot" dts
          fi

          if [ -d module-staging ]; then
            tar -czf artifacts/modules.tar.gz \
              -C module-staging .
          fi

          if [ -d diagnostics ]; then
            cp -a diagnostics artifacts/
          fi

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Singularity-event-horizon-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
