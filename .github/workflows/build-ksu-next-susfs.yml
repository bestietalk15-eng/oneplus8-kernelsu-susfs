
name: Singularity OnePlus 8 Pro Kernel Build

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"

permissions:
  contents: read

concurrency:
  group: singularity-instantnoodlep-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build instantnoodlep kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    env:
      KERNEL_SOURCE: https://github.com/The-Anomalist/Singularity.git
      KERNEL_BRANCH: event-horizon
      DEVICE: instantnoodlep
      KERNEL_OUT: ${{ github.workspace }}/kernel-out
      MODULE_STAGING: ${{ github.workspace }}/module-staging

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ca-certificates \
            clang-14 lld-14 llvm-14 lld \
            flex git libelf-dev libssl-dev \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            make pahole perl python3 python3-pip \
            rsync tar xz-utils zstd \
            device-tree-compiler cpio

          command -v clang-14
          command -v ld.lld-14 || command -v ld.lld

      - name: Clone Singularity source
        run: |
          set -euo pipefail

          git clone \
            --depth=1 \
            --single-branch \
            --branch "$KERNEL_BRANCH" \
            --recurse-submodules \
            --shallow-submodules \
            "$KERNEL_SOURCE" kernel

          cd kernel

          echo "Source: $KERNEL_SOURCE"
          echo "Branch: $(git branch --show-current)"
          echo "Commit: $(git rev-parse HEAD)"

          git submodule status

          test "$(git branch --show-current)" = "$KERNEL_BRANCH"

      - name: Verify existing KernelSU-Next
        working-directory: kernel
        run: |
          set -euo pipefail

          if [ ! -d KernelSU-Next ]; then
            echo "::error::KernelSU-Next directory is missing."
            git submodule status
            exit 1
          fi

          if [ ! -d KernelSU-Next/kernel ]; then
            echo "::error::KernelSU-Next source is incomplete."
            find KernelSU-Next -maxdepth 3 -type f \
              | head -80 || true
            exit 1
          fi

          echo "=== Existing KernelSU integration ==="

          git grep -n -i -E \
            'CONFIG_KSU|kernelsu|KernelSU-Next' \
            -- Makefile Kconfig drivers arch/arm64/configs \
            > ../kernelsu-audit.txt || true

          cat ../kernelsu-audit.txt || true

          if ! grep -q 'CONFIG_KSU' ../kernelsu-audit.txt; then
            echo "::error::Existing KernelSU build integration was not found."
            echo "No duplicate implementation will be added automatically."
            exit 1
          fi

      - name: Audit existing SUSFS integration
        working-directory: kernel
        run: |
          set -euo pipefail

          git grep -n -i -E \
            'CONFIG_.*SUSFS|susfs' \
            -- '*Kconfig*' '*Makefile*' fs include/linux drivers \
            > ../susfs-audit.txt || true

          cat ../susfs-audit.txt || true

          echo "Audit only. SUSFS patches will not be reapplied."

      - name: Locate kernel defconfig
        id: config
        working-directory: kernel
        run: |
          set -euo pipefail

          candidates=(
            vendor/kona-perf_defconfig
            kona-perf_defconfig
            vendor/kona_defconfig
            kona_defconfig
            vendor/instantnoodlep_defconfig
            instantnoodlep_defconfig
          )

          selected=""

          for candidate in "${candidates[@]}"; do
            if [ -f "arch/arm64/configs/$candidate" ]; then
              selected="$candidate"
              break
            fi
          done

          if [ -z "$selected" ]; then
            echo "::error::No recognized defconfig found."
            find arch/arm64/configs -type f \
              -name '*defconfig' | head -200
            exit 1
          fi

          echo "Selected defconfig: $selected"
          echo "defconfig=$selected" >> "$GITHUB_OUTPUT"

      - name: Configure kernel with LKM support
        working-directory: kernel
        env:
          DEFCONFIG: ${{ steps.config.outputs.defconfig }}
        run: |
          set -euo pipefail

          export PATH="/usr/lib/llvm-14/bin:$PATH"
          export LD=ld.lld-14

          mkdir -p "$KERNEL_OUT"

          echo "Using defconfig: $DEFCONFIG"
          echo "Using linker: $(command -v "$LD")"

          make O="$KERNEL_OUT" \
            ARCH=arm64 \
            LLVM=-14 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            "$DEFCONFIG"

          scripts/config --file "$KERNEL_OUT/.config" \
            --enable MODULES \
            --enable KPROBES \
            --enable KALLSYMS \
            --enable KALLSYMS_ALL \
            --enable KSU

          make O="$KERNEL_OUT" \
            ARCH=arm64 \
            LLVM=-14 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

          cp "$KERNEL_OUT/.config" ../kernel-config.txt

          echo "=== Relevant kernel configuration ==="

          grep -E \
            '^(CONFIG_MODULES|CONFIG_KPROBES|CONFIG_KSU|CONFIG_KALLSYMS)=' \
            "$KERNEL_OUT/.config" || true

          for option in MODULES KSU; do
            if ! grep -qx "CONFIG_${option}=y" \
                "$KERNEL_OUT/.config"; then
              echo "::error::CONFIG_${option}=y is unavailable."
              exit 1
            fi
          done

      - name: Audit Qualcomm charger API
        working-directory: kernel
        run: |
          set -euo pipefail

          SRC="drivers/power/supply/qcom/schgm-flash.c"
          LIB="drivers/power/supply/qcom/smb5-lib.h"

          if [ ! -f "$SRC" ]; then
            echo "Qualcomm charger source not present; skipping audit."
            exit 0
          fi

          git grep -n -E \
            'struct smb_charger|struct smb_irq_data|smblib_read[[:space:]]*\(|smblib_write[[:space:]]*\(|smblib_masked_write[[:space:]]*\(' \
            -- drivers/power/supply/qcom \
            > ../charger-api-audit.txt || true

          cat ../charger-api-audit.txt || true

          if [ -f "$LIB" ]; then
            echo "Found smb5-lib.h."
            grep -n -E \
              'struct smb_charger|struct smb_irq_data|smblib_read|smblib_write|smblib_masked_write' \
              "$LIB" || true
          else
            echo "smb5-lib.h is absent at the expected path."
          fi

          echo "No speculative source changes made."

      - name: Build kernel image, DTBs and modules
        working-directory: kernel
        run: |
          set -euo pipefail

          export PATH="/usr/lib/llvm-14/bin:$PATH"
          export LD=ld.lld-14

          make -j"$(nproc)" \
            O="$KERNEL_OUT" \
            ARCH=arm64 \
            LLVM=-14 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image.gz dtbs modules \
            2>&1 | tee ../kernel-build.log

      - name: Stage loadable modules
        if: success()
        working-directory: kernel
        run: |
          set -euo pipefail

          mkdir -p "$MODULE_STAGING"

          make O="$KERNEL_OUT" \
            ARCH=arm64 \
            LLVM=-14 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            INSTALL_MOD_PATH="$MODULE_STAGING" \
            modules_install

          find "$MODULE_STAGING" -type f -name '*.ko' \
            -print | tee ../module-list.txt

      - name: Collect build artifacts
        if: always()
        run: |
          set -euo pipefail

          mkdir -p artifacts

          for file in \
            kernel-build.log \
            kernel-config.txt \
            kernelsu-audit.txt \
            susfs-audit.txt \
            charger-api-audit.txt \
            module-list.txt
          do
            if [ -f "$file" ]; then
              cp "$file" artifacts/
            fi
          done

          if [ -d kernel-out ]; then
            cp kernel-out/.config artifacts/kernel.config \
              2>/dev/null || true

            for image in \
              kernel-out/arch/arm64/boot/Image \
              kernel-out/arch/arm64/boot/Image.gz \
              kernel-out/arch/arm64/boot/Image.gz-dtb
            do
              if [ -f "$image" ]; then
                mkdir -p artifacts/boot
                cp "$image" artifacts/boot/
              fi
            done

            if [ -d kernel-out/arch/arm64/boot/dts ]; then
              tar -czf artifacts/device-trees.tar.gz \
                -C kernel-out/arch/arm64/boot dts
            fi

            find kernel-out -type f -name '*.ko' \
              -exec cp --parents '{}' artifacts/ \; \
              2>/dev/null || true
          fi

          if [ -d module-staging ]; then
            tar -czf artifacts/loadable-modules.tar.gz \
              -C module-staging .
          fi

          if [ -d kernel/.git ]; then
            git -C kernel rev-parse HEAD \
              > artifacts/kernel-commit.txt
          fi

          {
            echo "Branch: $KERNEL_BRANCH"
            echo "Device: $DEVICE"
            echo "LKM support requested: CONFIG_MODULES=y"
            echo "SUSFS: no automatic patching"
            echo "Flashable ZIP: not generated"
            echo "Partition writes: none"
          } > artifacts/build-summary.txt

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: singularity-instantnoodlep-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
