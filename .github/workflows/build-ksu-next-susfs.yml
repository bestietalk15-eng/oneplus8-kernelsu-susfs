name: Build Singularity LKM Kernel for OnePlus 8 Pro

on:
  workflow_dispatch:
    inputs:
      build_modules:
        description: "Build and upload .ko modules separately"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  KERNEL_SOURCE: https://github.com/The-Anomalist/Singularity.git
  KERNEL_BRANCH: event-horizon
  DEVICE_CODENAME: instantnoodlep
  KERNEL_DEFCONFIG: vendor/kona-perf_defconfig
  ORIGINAL_ZIP: payload/Singularity-original.zip
  ZIP_NAME: Singularity-event-horizon-instantnoodlep.zip
  CLANG_URL: https://github.com/ZyCromerZ/Clang/releases/download/14.0.6-20250704-release/Clang-14.0.6-20250704.tar.gz

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout workflow repository and original installer payload
        uses: actions/checkout@v4

      - name: Validate original ZIP exists
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s "$ORIGINAL_ZIP" ]]; then
            echo "::error::Put the untouched Singularity installer ZIP at $ORIGINAL_ZIP in this workflow repository."
            exit 1
          fi
          unzip -t "$ORIGINAL_ZIP"
          sha256sum "$ORIGINAL_ZIP" | tee original-zip.sha256

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio curl flex git libelf-dev libssl-dev \
            lz4 make python3 python-is-python3 rsync zip unzip dwarves patch \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Clone Singularity source and submodules
        shell: bash
        run: |
          set -euo pipefail
          git clone --recurse-submodules --single-branch -b "$KERNEL_BRANCH" "$KERNEL_SOURCE" kernel
          test -f kernel/Makefile
          echo "Kernel commit: $(git -C kernel rev-parse HEAD)"
          echo "Kernel branch: $(git -C kernel branch --show-current)"
          git -C kernel submodule status || true

      - name: Verify existing KernelSU-Next and SUSFS source integration
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking existing source integration. This workflow does not re-clone KSU or re-apply SUSFS patches."
          find . -maxdepth 5 \( -iname '*kernelsu*' -o -iname '*ksunext*' \) -print | head -150
          if [[ -L drivers/kernelsu ]]; then
            test -e drivers/kernelsu
          elif [[ -d drivers/kernelsu ]]; then
            :
          else
            echo "::error::Existing drivers/kernelsu integration was not found; refusing to invent an integration."
            exit 1
          fi
          test -f drivers/kernelsu/Kconfig

      - name: Download Clang toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/clang"
          curl --fail --location --retry 3 "$CLANG_URL" -o "$RUNNER_TEMP/clang.tar.gz"
          tar -xzf "$RUNNER_TEMP/clang.tar.gz" -C "$RUNNER_TEMP/clang"
          test -x "$RUNNER_TEMP/clang/bin/clang"
          echo "$RUNNER_TEMP/clang/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/clang/bin/clang" --version

      - name: Validate defconfig and original ZIP payload structure
        shell: bash
        run: |
          set -euo pipefail
          test -f "kernel/arch/arm64/configs/$KERNEL_DEFCONFIG" || {
            echo "::error::Defconfig not found: arch/arm64/configs/$KERNEL_DEFCONFIG"
            find kernel/arch/arm64/configs -maxdepth 4 -type f \( -iname '*kona*' -o -iname '*instantnoodle*' \) -print | head -100
            exit 1
          }
          rm -rf original-payload
          mkdir original-payload
          unzip -q "$ORIGINAL_ZIP" -d original-payload
          find original-payload -type f -print | sort > original-payload-files.txt
          installer="$(find original-payload -type f -name anykernel.sh -print -quit)"
          test -n "$installer" || {
            echo "::error::No anykernel.sh found inside the supplied original ZIP."
            exit 1
          }
          echo "$installer" > installer-path.txt
          echo "Original installer: $installer"
          grep -RIl --include='*' 'Image-KSU' original-payload | head -20 || true
          grep -RIl --include='*' 'Image-NoKSU' original-payload | head -20 || true
          test -n "$(find original-payload -type f -name 'Image-KSU' -print -quit)" || {
            echo "::error::Original ZIP does not contain an Image-KSU payload. Refusing to guess the installer filename."
            exit 1
          }
          test -n "$(find original-payload -type f -name 'Image-NoKSU' -print -quit)" || {
            echo "::error::Original ZIP does not contain an Image-NoKSU payload. Refusing to guess the installer filename."
            exit 1
          }
          test -f "$(dirname "$installer")/tools/ak3-core.sh" || {
            echo "::error::Expected tools/ak3-core.sh beside the original installer; cannot audit installer helper behavior."
            exit 1
          }

      - name: Audit installer partition-write behavior
        shell: bash
        run: |
          set -euo pipefail
          installer="$(cat installer-path.txt)"
          root="$(dirname "$installer")"
          core="$root/tools/ak3-core.sh"

          # DTBO references for detection/size validation are allowed. Actual
          # image-write commands targeting DTBO or any non-boot partition are not.
          if grep -Ein \
            '(^|[;&|[:space:]])(write_raw_image|flash_image|write_partition|erase_partition|format_partition)[[:space:]]+[^#]*((dtbo|vendor_boot|vbmeta|super|metadata|userdata|system|vendor|product|odm)(_[ab])?([[:space:]]|$))' \
            "$installer" "$core"; then
            echo "::error::Installer/helper appears to write a non-boot partition. ZIP build blocked by the boot-only safety requirement."
            exit 1
          fi

          # AnyKernel scripts may route writes through variables/functions;
          # do not modify the original script to make the audit pass.
          if grep -Ein 'write_raw_image|flash_image|write_partition|erase_partition|format_partition' "$installer" "$core"; then
            echo "::warning::Generic partition-write helpers exist. Confirming boot-only safety requires tracing their call sites."
          fi
          if ! grep -Eq 'write_boot|dump_boot' "$installer" "$core"; then
            echo "::error::Could not find the expected boot-image write path."
            exit 1
          fi
          echo "Static audit passed for obvious non-boot write commands; installer remains unchanged."

      - name: Build KSU and non-KSU kernel images with LKM support
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          export ARCH=arm64
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          DEFCONFIG="$KERNEL_DEFCONFIG"
          mkdir -p out-ksu out-noksu

          build_variant() {
            local variant="$1"
            local outdir="$2"
            local ksu="$3"

            echo "===== Configure $variant ====="
            make O="$outdir" "$DEFCONFIG"
            scripts/config --file "$outdir/.config" --enable MODULES
            scripts/config --file "$outdir/.config" --enable KALLSYMS
            scripts/config --file "$outdir/.config" --enable KALLSYMS_ALL

            if [[ "$ksu" == "yes" ]]; then
              scripts/config --file "$outdir/.config" --enable KSU
            else
              scripts/config --file "$outdir/.config" --disable KSU
            fi

            make -j"$(nproc --all)" O="$outdir" olddefconfig
            grep -q '^CONFIG_MODULES=y$' "$outdir/.config" || {
              echo "::error::CONFIG_MODULES=y did not survive olddefconfig for $variant."
              exit 1
            }
            if [[ "$ksu" == "yes" ]]; then
              grep -q '^CONFIG_KSU=y$' "$outdir/.config" || {
                echo "::error::CONFIG_KSU=y did not survive olddefconfig."
                exit 1
              }
            fi

            make -j"$(nproc --all)" O="$outdir"
            test -s "$outdir/arch/arm64/boot/Image"
            cp "$outdir/arch/arm64/boot/Image" "$GITHUB_WORKSPACE/$variant"

            if [[ "${{ inputs.build_modules }}" == "true" ]]; then
              make -j"$(nproc --all)" O="$outdir" modules
              stage="$GITHUB_WORKSPACE/modules-$variant"
              mkdir -p "$stage"
              make O="$outdir" INSTALL_MOD_PATH="$stage" modules_install
              find "$stage" -type f -name '*.ko' -print > "$GITHUB_WORKSPACE/$variant-modules.txt"
              tar -czf "$GITHUB_WORKSPACE/$variant-modules.tar.gz" -C "$stage" .
            fi

            cp "$outdir/.config" "$GITHUB_WORKSPACE/$variant.config"
          }

          build_variant Image-KSU out-ksu yes
          build_variant Image-NoKSU out-noksu no

      - name: Replace only the two expected kernel images in original ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -s Image-KSU
          test -s Image-NoKSU
          ksu_target="$(find original-payload -type f -name 'Image-KSU' -print -quit)"
          noksu_target="$(find original-payload -type f -name 'Image-NoKSU' -print -quit)"
          test -n "$ksu_target"
          test -n "$noksu_target"

          cp Image-KSU "$ksu_target"
          cp Image-NoKSU "$noksu_target"
          cmp -s Image-KSU "$ksu_target"
          cmp -s Image-NoKSU "$noksu_target"

          # Confirm the original installer and all non-kernel payload files
          # are unchanged relative to the extracted original ZIP.
          installer="$(cat installer-path.txt)"
          sha256sum "$installer" > installer-after.sha256

          # Compare device DTB/DTBO payloads to the original ZIP extraction.
          # The workflow never rebuilds or replaces them.
          find original-payload -type f \( -iname 'dtbo.img' -o -iname 'dtb.img' -o -iname '*dtbo*.img' \) -print -exec sha256sum {} \; | tee dtb-dtbo-preserved.txt

          rm -f "$ZIP_NAME"
          (cd original-payload && zip -qr "$GITHUB_WORKSPACE/$ZIP_NAME" .)
          unzip -t "$ZIP_NAME"
          unzip -l "$ZIP_NAME" | grep -E 'Image-KSU|Image-NoKSU|dtbo|dtb.img'
          test -s "$ZIP_NAME"

      - name: Upload flashable ZIP and kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Singularity-instantnoodlep-build-${{ github.run_number }}
          path: |
            ${{ env.ZIP_NAME }}
            Image-KSU
            Image-NoKSU
            Image-KSU.config
            Image-NoKSU.config
            modules-Image-KSU.tar.gz
            modules-Image-NoKSU.tar.gz
            Image-KSU-modules.txt
            Image-NoKSU-modules.txt
            original-zip.sha256
            original-payload-files.txt
            dtb-dtbo-preserved.txt
          if-no-files-found: warn
          retention-days: 14
