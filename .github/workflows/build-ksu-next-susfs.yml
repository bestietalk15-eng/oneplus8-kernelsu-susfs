
name: Singularity Event Horizon - OnePlus 8 Pro Validation

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/singularity-event-horizon.yml"

permissions:
  contents: read

concurrency:
  group: singularity-event-horizon-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and Validate Kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      KERNEL_SOURCE: https://github.com/The-Anomalist/Singularity.git
      KERNEL_BRANCH: event-horizon
      DEVICE: instantnoodlep
      ARCH: arm64
      SUBARCH: arm64
      LLVM: "1"
      OUT: ${{ github.workspace }}/kernel-out

    steps:
      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ca-certificates \
            ccache \
            clang \
            cmake \
            curl \
            flex \
            git \
            libelf-dev \
            libncurses-dev \
            lld \
            llvm \
            make \
            pahole \
            python3 \
            python3-pip \
            rsync \
            unzip \
            zip \
            zlib1g-dev

      - name: Checkout exact Singularity branch
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --branch "$KERNEL_BRANCH" \
            --recurse-submodules \
            "$KERNEL_SOURCE" \
            kernel

          cd kernel

          git checkout "$KERNEL_BRANCH"
          git submodule update --init --recursive

          echo "===== Source repository ====="
          git remote -v

          echo "===== Source branch ====="
          git branch --show-current

          echo "===== Source commit ====="
          git rev-parse HEAD

          echo "===== Submodule revisions ====="
          git submodule status --recursive

          test "$(git branch --show-current)" = "$KERNEL_BRANCH"
          test -f Makefile

      - name: Verify KernelSU-Next checkout
        shell: bash
        working-directory: kernel
        run: |
          set -euo pipefail

          if [ -d KernelSU-Next ]; then
            echo "KernelSU-Next directory found."

            git -C KernelSU-Next rev-parse HEAD 2>/dev/null || true
            git -C KernelSU-Next status --short 2>/dev/null || true

            find KernelSU-Next -maxdepth 2 -type f \
              \( -name Kconfig -o -name Makefile \) \
              -print | head -80 || true
          else
            echo "::warning::KernelSU-Next directory not found."
          fi

      - name: Audit device and defconfig support
        shell: bash
        working-directory: kernel
        run: |
          set -euo pipefail

          echo "===== Device references ====="

          git grep -niE \
            'instantnoodlep|OnePlus 8 Pro|OnePlus8Pro' \
            HEAD -- \
            'arch/arm64/*' \
            '*/kona*' \
            '*/instantnoodlep*' \
            2>/dev/null || true

          echo "===== Available Kona defconfigs ====="

          find arch/arm64/configs -type f \
            -iname '*kona*defconfig' -print | sort || true

          echo "===== Device tree references ====="

          find arch/arm64/boot/dts -type f \
            \( -iname '*kona*' -o -iname '*instantnoodlep*' \) \
            -print 2>/dev/null | head -200 || true

          echo "===== Compatibility note ====="
          echo "A Kona defconfig alone does not establish OnePlus 8 Pro compatibility."

      - name: Select an available Kona defconfig
        id: config
        shell: bash
        working-directory: kernel
        run: |
          set -euo pipefail

          CONFIG_DIR="arch/arm64/configs"
          SELECTED=""

          for candidate in \
            "$CONFIG_DIR/vendor/kona-perf_defconfig" \
            "$CONFIG_DIR/kona-perf_defconfig" \
            "$CONFIG_DIR/vendor/kona_defconfig" \
            "$CONFIG_DIR/kona_defconfig"
          do
            if [ -f "$candidate" ]; then
              SELECTED="$candidate"
              break
            fi
          done

          if [ -z "$SELECTED" ]; then
            echo "::error::No expected Kona defconfig was found."
            echo "Available candidates:"
            find "$CONFIG_DIR" -type f \
              -iname '*kona*defconfig' -print | sort || true
            exit 1
          fi

          # make expects the defconfig name relative to arch/arm64/configs.
          DEFCONFIG="${SELECTED#"$CONFIG_DIR"/}"

          echo "Selected defconfig file: $SELECTED"
          echo "Defconfig name for make: $DEFCONFIG"

          test -f "$SELECTED"

          echo "defconfig=$DEFCONFIG" >> "$GITHUB_OUTPUT"

      - name: Configure kernel with loadable module support
        shell: bash
        working-directory: kernel
        env:
          DEFCONFIG: ${{ steps.config.outputs.defconfig }}
        run: |
          set -euxo pipefail

          test -n "$DEFCONFIG"

          mkdir -p "$OUT"

          echo "Using defconfig: $DEFCONFIG"

          make \
            O="$OUT" \
            ARCH="$ARCH" \
            SUBARCH="$SUBARCH" \
            LLVM="$LLVM" \
            "$DEFCONFIG"

          test -f "$OUT/.config"

          # Enable loadable kernel modules without forcing every driver
          # to be modular or built-in.
          scripts/config \
            --file "$OUT/.config" \
            --enable MODULES

          make \
            O="$OUT" \
            ARCH="$ARCH" \
            SUBARCH="$SUBARCH" \
            LLVM="$LLVM" \
            olddefconfig

          echo "===== Resolved module configuration ====="

          grep -E \
            '^CONFIG_MODULES=|^# CONFIG_MODULES is not set' \
            "$OUT/.config" || true

          if ! grep -qx 'CONFIG_MODULES=y' "$OUT/.config"; then
            echo "::error::CONFIG_MODULES=y did not survive olddefconfig."
            exit 1
          fi

          cp "$OUT/.config" "$GITHUB_WORKSPACE/kernel-config.txt"

          echo "LKM support is enabled."
          echo "Drivers can be built in (=y) or as modules (=m), depending"
          echo "on their individual resolved configuration."

      - name: Check missing BPF JIT fallback
        shell: bash
        working-directory: kernel
        run: |
          set -euo pipefail

          HEADER="include/linux/filter.h"

          if [ ! -f "$HEADER" ]; then
            echo "::error::Missing $HEADER."
            exit 1
          fi

          python3 <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path("include/linux/filter.h")
          text = path.read_text()

          signature = (
              r"static\s+inline\s+bool\s+"
              r"bpf_jit_blinding_enabled\s*"
              r"\(\s*struct\s+bpf_prog\s*\*\s*prog\s*\)"
          )

          marker = re.search(
              r"^[ \t]*#\s*else\s*/\*\s*CONFIG_BPF_JIT\s*\*/[^\n]*",
              text,
              re.MULTILINE,
          )

          if not marker:
              print(
                  "::error::Cannot locate the exact CONFIG_BPF_JIT "
                  "fallback section. No automatic patch applied."
              )
              sys.exit(1)

          tail = text[marker.end():]

          end_match = re.search(
              r"^[ \t]*#\s*endif\b[^\n]*CONFIG_BPF_JIT[^\n]*",
              tail,
              re.MULTILINE,
          )

          if not end_match:
              print(
                  "::error::Cannot identify the end of the "
                  "CONFIG_BPF_JIT conditional."
              )
              sys.exit(1)

          section_end = marker.end() + end_match.start()
          fallback_section = text[marker.end():section_end]

          fallback_definitions = list(
              re.finditer(signature, fallback_section)
          )
          all_definitions = list(re.finditer(signature, text))

          if len(fallback_definitions) == 1:
              print("BPF JIT fallback already exists.")
              sys.exit(0)

          if len(fallback_definitions) > 1:
              print(
                  "::error::Multiple fallback definitions detected."
              )
              sys.exit(1)

          if len(all_definitions) != 1:
              print(
                  "::error::Unexpected helper definition count. "
                  "Refusing to modify the source automatically."
              )
              sys.exit(1)

          fallback = (
              "\n"
              "static inline bool bpf_jit_blinding_enabled"
              "(struct bpf_prog *prog)\n"
              "{\n"
              "    return false;\n"
              "}\n"
              "\n"
          )

          updated = text[:section_end] + fallback + text[section_end:]
          path.write_text(updated)

          print("Added missing CONFIG_BPF_JIT fallback.")
          PY

          echo "===== BPF helper definitions ====="

          grep -n -A5 -B3 \
            'bpf_jit_blinding_enabled' "$HEADER" || true

      - name: Audit KernelSU and SUSFS integration
        shell: bash
        working-directory: kernel
        run: |
          set -euo pipefail

          echo "===== KernelSU references ====="

          git grep -niE \
            'KernelSU|kernelsu|ksu_init|CONFIG_KSU' \
            HEAD -- \
            Kconfig \
            Makefile \
            'init/*' \
            'drivers/*' \
            'fs/*' \
            2>/dev/null | head -250 || true

          echo "===== SUSFS references ====="

          git grep -niE \
            'susfs|CONFIG_KSU_SUSFS|ksu_susfs' \
            HEAD -- \
            Kconfig \
            Makefile \
            'fs/*' \
            'include/*' \
            'drivers/*' \
            2>/dev/null | head -250 || true

          echo "This audit does not prove full KernelSU or SUSFS integration."

      - name: Build kernel image, device trees, and modules
        shell: bash
        working-directory: kernel
        run: |
          set -uo pipefail

          mkdir -p "$OUT"

          set +e

          make \
            -j"$(nproc)" \
            O="$OUT" \
            ARCH="$ARCH" \
            SUBARCH="$SUBARCH" \
            LLVM="$LLVM" \
            Image.gz dtbs modules \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          status=${PIPESTATUS[0]}

          set -e

          if [ "$status" -ne 0 ]; then
            echo "::error::Kernel build failed with exit code $status."

            echo "===== Relevant diagnostics ====="

            grep -n -B5 -A8 -E \
              'error:|fatal error:|undefined reference|Error [0-9]' \
              "$GITHUB_WORKSPACE/build.log" | tail -250 || true

            exit "$status"
          fi

      - name: Validate build artifacts
        if: success()
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== Candidate boot images ====="

          find "$OUT/arch/arm64/boot" -maxdepth 3 -type f \
            \( -name Image -o -name Image.gz \
               -o -name Image.gz-dtb -o -name '*.dtb' \
               -o -name '*.dtbo' \) \
            -print | sort || true

          echo "===== Kernel modules ====="

          find "$OUT" -type f -name '*.ko' -print | sort || true

          if [ ! -s "$OUT/arch/arm64/boot/Image.gz" ] && \
             [ ! -s "$OUT/arch/arm64/boot/Image" ]; then
            echo "::error::No non-empty kernel image was produced."
            exit 1
          fi

          if [ ! -s "$OUT/.config" ]; then
            echo "::error::Final .config is missing."
            exit 1
          fi

          grep -qx 'CONFIG_MODULES=y' "$OUT/.config"

          echo "Artifact checks passed."
          echo "Boot compatibility is not established by compilation alone."

      - name: Collect diagnostic artifacts
        if: always()
        shell: bash
        run: |
          set +e

          mkdir -p "$GITHUB_WORKSPACE/diagnostics"

          [ ! -f "$GITHUB_WORKSPACE/build.log" ] || \
            cp "$GITHUB_WORKSPACE/build.log" \
              "$GITHUB_WORKSPACE/diagnostics/"

          [ ! -f "$GITHUB_WORKSPACE/kernel-config.txt" ] || \
            cp "$GITHUB_WORKSPACE/kernel-config.txt" \
              "$GITHUB_WORKSPACE/diagnostics/"

          if [ -d "$GITHUB_WORKSPACE/kernel" ]; then
            (
              cd "$GITHUB_WORKSPACE/kernel"
              git rev-parse HEAD
              git branch --show-current
              git submodule status --recursive
            ) > "$GITHUB_WORKSPACE/diagnostics/source-revisions.txt" 2>&1

            if [ -f "$GITHUB_WORKSPACE/kernel/include/linux/filter.h" ]; then
              grep -n -A5 -B3 \
                'bpf_jit_blinding_enabled' \
                "$GITHUB_WORKSPACE/kernel/include/linux/filter.h" \
                > "$GITHUB_WORKSPACE/diagnostics/bpf-helper.txt" 2>&1
            fi
          fi

          if [ -f "$OUT/.config" ]; then
            cp "$OUT/.config" \
              "$GITHUB_WORKSPACE/diagnostics/final-kernel.config"
          fi

      - name: Upload build artifacts and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: singularity-event-horizon-${{ github.run_number }}
          path: |
            kernel-out/arch/arm64/boot/Image
            kernel-out/arch/arm64/boot/Image.gz
            kernel-out/arch/arm64/boot/dts/**/*.dtb
            kernel-out/arch/arm64/boot/dts/**/*.dtbo
            kernel-out/.config
            kernel-config.txt
            build.log
            diagnostics/
          if-no-files-found: warn
          retention-days: 14

      - name: Report validation status
        if: always()
        shell: bash
        run: |
          echo "Source: $KERNEL_SOURCE"
          echo "Branch: $KERNEL_BRANCH"
          echo "Requested device: $DEVICE"
          echo "LKM support: CONFIG_MODULES=y required"
          echo "Flashable ZIP: not generated"
          echo "Device boot compatibility: not yet established"
