
name: Singularity Event Horizon - OnePlus 8 Pro Validation

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/singularity-event-horizon.yml"

permissions:
  contents: read

concurrency:
  group: singularity-event-horizon-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and Validate Kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      KERNEL_SOURCE: https://github.com/The-Anomalist/Singularity.git
      KERNEL_BRANCH: event-horizon
      DEVICE: instantnoodlep
      ARCH: arm64
      SUBARCH: arm64
      LLVM: "1"
      OUT: ${{ github.workspace }}/kernel-out

    steps:
      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ca-certificates \
            ccache \
            clang \
            cmake \
            curl \
            flex \
            git \
            libelf-dev \
            libncurses-dev \
            lld \
            llvm \
            make \
            pahole \
            python3 \
            python3-pip \
            rsync \
            unzip \
            zip \
            zlib1g-dev

      - name: Checkout exact Singularity branch
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --branch "$KERNEL_BRANCH" \
            --recurse-submodules \
            "$KERNEL_SOURCE" \
            kernel

          cd kernel

          git checkout "$KERNEL_BRANCH"
          git submodule update --init --recursive

          echo "===== Kernel source ====="
          git remote -v
          git branch --show-current
          git rev-parse HEAD
          git status --short

          echo "===== Submodule revisions ====="
          git submodule status --recursive

          test "$(git branch --show-current)" = "$KERNEL_BRANCH"
          test -f Makefile

      - name: Verify KernelSU-Next checkout
        shell: bash
        working-directory: kernel
        run: |
          set -euxo pipefail

          if [ -d KernelSU-Next/.git ] || \
             git submodule status KernelSU-Next 2>/dev/null | grep -q .; then
            echo "KernelSU-Next directory detected."
            if [ -d KernelSU-Next ]; then
              git -C KernelSU-Next rev-parse HEAD || true
              git -C KernelSU-Next status --short || true
            fi
          else
            echo "::warning::KernelSU-Next was not detected as a populated submodule."
          fi

          if [ -d KernelSU-Next ]; then
            find KernelSU-Next -maxdepth 2 -type f \
              \( -name 'Kconfig' -o -name 'Makefile' \) \
              -print | head -80 || true
          fi

      - name: Audit device and defconfig support
        shell: bash
        working-directory: kernel
        run: |
          set -euo pipefail

          echo "===== Device references ====="
          git grep -niE \
            'instantnoodlep|OnePlus 8 Pro|OnePlus8Pro' \
            HEAD -- \
            'arch/arm64/*' \
            '*/kona*' \
            '*/instantnoodlep*' \
            2>/dev/null || true

          echo "===== Kona defconfigs ====="
          find arch/arm64/configs -type f \
            -iname '*kona*defconfig' -print | sort || true

          echo "===== Device tree references ====="
          find arch/arm64/boot/dts -type f \
            \( -iname '*kona*' -o -iname '*instantnoodlep*' \) \
            -print 2>/dev/null | head -200 || true

          echo "===== Compatibility warning ====="
          echo "A Kona defconfig or Snapdragon 865 support alone does not prove"
          echo "OnePlus 8 Pro compatibility. Device-specific validation is required."

      - name: Select an available Kona defconfig
        id: config
        shell: bash
        working-directory: kernel
        run: |
          set -euo pipefail

          mapfile -t DEFCONFIGS < <(
            find arch/arm64/configs -type f \
              -iname '*kona*defconfig' | sort
          )

          if [ "${#DEFCONFIGS[@]}" -eq 0 ]; then
            echo "::error::No Kona defconfig was found."
            echo "Refusing to guess a different device configuration."
            exit 1
          fi

          printf '%s\n' "${DEFCONFIGS[@]}"

          SELECTED=""

          for candidate in \
            arch/arm64/configs/vendor/kona-perf_defconfig \
            arch/arm64/configs/kona-perf_defconfig \
            arch/arm64/configs/vendor/kona_defconfig \
            arch/arm64/configs/kona_defconfig
          do
            if [ -f "$candidate" ]; then
              SELECTED="$candidate"
              break
            fi
          done

          if [ -z "$SELECTED" ]; then
            echo "::error::Kona defconfigs exist, but none of the expected names matched."
            echo "Inspect the listed files and explicitly choose the correct base config."
            exit 1
          fi

          echo "Selected defconfig: $SELECTED"
          echo "defconfig=$SELECTED" >> "$GITHUB_OUTPUT"

      - name: Configure kernel with loadable module support
        shell: bash
        working-directory: kernel
        run: |
          set -euxo pipefail

          mkdir -p "$OUT"

          make \
            O="$OUT" \
            ARCH="$ARCH" \
            SUBARCH="$SUBARCH" \
            LLVM="$LLVM" \
            "$DEFCONFIG"

          test -x scripts/config

          scripts/config --file "$OUT/.config" --enable MODULES

          make \
            O="$OUT" \
            ARCH="$ARCH" \
            SUBARCH="$SUBARCH" \
            LLVM="$LLVM" \
            olddefconfig

          echo "===== Module configuration ====="
          grep -E '^CONFIG_MODULES=|^# CONFIG_MODULES is not set' \
            "$OUT/.config" || true

          if ! grep -qx 'CONFIG_MODULES=y' "$OUT/.config"; then
            echo "::error::CONFIG_MODULES=y did not survive olddefconfig."
            exit 1
          fi

          cp "$OUT/.config" "$GITHUB_WORKSPACE/kernel-config.txt"

          echo "LKM support is enabled."
          echo "Individual drivers remain built-in or modular according to"
          echo "their resolved configuration. They cannot be both =y and =m."

      - name: Fix missing BPF JIT fallback safely
        shell: bash
        working-directory: kernel
        run: |
          set -euo pipefail

          HEADER="include/linux/filter.h"

          if [ ! -f "$HEADER" ]; then
            echo "::error::Missing $HEADER; cannot inspect BPF helper."
            exit 1
          fi

          python3 <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path("include/linux/filter.h")
          text = path.read_text()

          signature = (
              r"static\s+inline\s+bool\s+"
              r"bpf_jit_blinding_enabled\s*"
              r"\(\s*struct\s+bpf_prog\s*\*\s*prog\s*\)"
          )

          marker = re.search(
              r"^[ \t]*#\s*else\s*/\*\s*CONFIG_BPF_JIT\s*\*/[^\n]*",
              text,
              flags=re.MULTILINE,
          )

          if not marker:
              print(
                  "::error::Could not find the exact "
                  "'#else /* CONFIG_BPF_JIT */' section."
              )
              print("No automatic source modification was made.")
              sys.exit(1)

          tail = text[marker.end():]

          end_match = re.search(
              r"^[ \t]*#\s*endif\b[^\n]*CONFIG_BPF_JIT[^\n]*",
              tail,
              flags=re.MULTILINE,
          )

          if not end_match:
              print(
                  "::error::Could not identify the end of the "
                  "CONFIG_BPF_JIT conditional section."
              )
              print("No automatic source modification was made.")
              sys.exit(1)

          fallback_end = marker.end() + end_match.start()
          fallback_section = text[marker.end():fallback_end]
          fallback_signatures = list(
              re.finditer(signature, fallback_section)
          )

          all_signatures = list(re.finditer(signature, text))

          if len(fallback_signatures) == 1:
              print("BPF JIT fallback already exists; no change required.")
              sys.exit(0)

          if len(fallback_signatures) > 1:
              print(
                  "::error::Multiple BPF helper definitions exist "
                  "in the CONFIG_BPF_JIT fallback section."
              )
              sys.exit(1)

          if not all_signatures:
              print(
                  "::error::No existing helper definition was found. "
                  "The source may need a different, version-specific fix."
              )
              sys.exit(1)

          if len(all_signatures) != 1:
              print(
                  "::error::Unexpected number of helper definitions; "
                  "refusing to guess which one to modify."
              )
              sys.exit(1)

          fallback = """
          static inline bool bpf_jit_blinding_enabled(struct bpf_prog *prog)
          {
              return false;
          }

          """

          updated = (
              text[:fallback_end]
              + fallback
              + text[fallback_end:]
          )

          path.write_text(updated)

          print("Inserted the missing CONFIG_BPF_JIT fallback.")
          print("The fallback returns false when BPF JIT is disabled.")
          PY

          echo "===== BPF helper definitions after check ====="
          grep -n -A4 -B2 \
            'bpf_jit_blinding_enabled' "$HEADER" || true

      - name: Audit KernelSU and SUSFS integration
        shell: bash
        working-directory: kernel
        run: |
          set -euo pipefail

          echo "===== KernelSU references ====="
          git grep -niE \
            'KernelSU|kernelsu|ksu_init|CONFIG_KSU' \
            HEAD -- \
            'Kconfig' \
            'Makefile' \
            'init/*' \
            'drivers/*' \
            'fs/*' \
            2>/dev/null | head -250 || true

          echo "===== SUSFS references ====="
          git grep -niE \
            'susfs|CONFIG_KSU_SUSFS|ksu_susfs' \
            HEAD -- \
            'Kconfig' \
            'Makefile' \
            'fs/*' \
            'include/*' \
            'drivers/*' \
            2>/dev/null | head -250 || true

          echo "===== SUSFS integration status ====="
          if git grep -qiE 'susfs|CONFIG_KSU_SUSFS' HEAD -- \
            'Kconfig' 'Makefile' 'fs/*' 'include/*' 'drivers/*' \
            2>/dev/null; then
            echo "Some SUSFS references exist."
            echo "This does not prove the required patch set is fully integrated."
          else
            echo "::warning::No SUSFS integration references were detected."
          fi

          echo "No SUSFS patch is claimed as applied by this audit step."

      - name: Build kernel image, device trees, and modules
        id: build
        shell: bash
        working-directory: kernel
        run: |
          set -uo pipefail

          mkdir -p "$OUT"
          set +e

          make \
            -j"$(nproc)" \
            O="$OUT" \
            ARCH="$ARCH" \
            SUBARCH="$SUBARCH" \
            LLVM="$LLVM" \
            Image.gz dtbs modules \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          status=${PIPESTATUS[0]}
          set -e

          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

          if [ "$status" -ne 0 ]; then
            echo "::error::Kernel build failed with exit code $status."
            echo "===== Relevant compiler diagnostics ====="
            grep -n -B5 -A8 -E \
              'error:|fatal error:|undefined reference|Error [0-9]' \
              "$GITHUB_WORKSPACE/build.log" | tail -250 || true
            exit "$status"
          fi

      - name: Validate build artifacts
        if: success()
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== Candidate images ====="
          find "$OUT/arch/arm64/boot" -maxdepth 3 -type f \
            \( -name 'Image' -o -name 'Image.gz' \
               -o -name 'Image.gz-dtb' -o -name '*.dtb' \
               -o -name '*.dtbo' \) \
            -print | sort || true

          echo "===== Built modules ====="
          find "$OUT" -type f -name '*.ko' -print | sort || true

          if [ ! -s "$OUT/arch/arm64/boot/Image.gz" ] && \
             [ ! -s "$OUT/arch/arm64/boot/Image" ]; then
            echo "::error::No non-empty kernel Image or Image.gz was produced."
            exit 1
          fi

          if [ ! -s "$OUT/.config" ]; then
            echo "::error::Final kernel configuration is missing."
            exit 1
          fi

          grep -qx 'CONFIG_MODULES=y' "$OUT/.config"

          echo "Basic artifact checks passed."
          echo "This does not prove that the kernel boots on instantnoodlep."

      - name: Collect diagnostic artifacts
        if: always()
        shell: bash
        run: |
          set +e

          mkdir -p "$GITHUB_WORKSPACE/diagnostics"

          if [ -f "$GITHUB_WORKSPACE/build.log" ]; then
            cp "$GITHUB_WORKSPACE/build.log" \
              "$GITHUB_WORKSPACE/diagnostics/"
          fi

          if [ -f "$GITHUB_WORKSPACE/kernel-config.txt" ]; then
            cp "$GITHUB_WORKSPACE/kernel-config.txt" \
              "$GITHUB_WORKSPACE/diagnostics/"
          fi

          if [ -d "$GITHUB_WORKSPACE/kernel" ]; then
            (
              cd "$GITHUB_WORKSPACE/kernel"
              git rev-parse HEAD
              git branch --show-current
              git submodule status --recursive
            ) > "$GITHUB_WORKSPACE/diagnostics/source-revisions.txt" 2>&1

            if [ -f "$GITHUB_WORKSPACE/kernel/include/linux/filter.h" ]; then
              grep -n -A5 -B3 \
                'bpf_jit_blinding_enabled' \
                "$GITHUB_WORKSPACE/kernel/include/linux/filter.h" \
                > "$GITHUB_WORKSPACE/diagnostics/bpf-helper.txt" 2>&1
            fi
          fi

          if [ -f "$OUT/.config" ]; then
            cp "$OUT/.config" \
              "$GITHUB_WORKSPACE/diagnostics/final-kernel.config"
          fi

          if [ -d "$OUT/arch/arm64/boot" ]; then
            mkdir -p "$GITHUB_WORKSPACE/diagnostics/boot"
            find "$OUT/arch/arm64/boot" -maxdepth 3 -type f \
              \( -name 'Image' -o -name 'Image.gz' \
                 -o -name '*.dtb' -o -name '*.dtbo' \) \
              -exec cp --parents '{}' \
                "$GITHUB_WORKSPACE/diagnostics/boot" \; 2>/dev/null
          fi

      - name: Upload kernel and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: singularity-event-horizon-${{ github.run_number }}
          path: |
            kernel-out/arch/arm64/boot/Image
            kernel-out/arch/arm64/boot/Image.gz
            kernel-out/arch/arm64/boot/dts/**/*.dtb
            kernel-out/arch/arm64/boot/dts/**/*.dtbo
            kernel-out/.config
            kernel-config.txt
            build.log
            diagnostics/
          if-no-files-found: warn
          retention-days: 14

      - name: Report validation status
        if: always()
        shell: bash
        run: |
          echo "Source: $KERNEL_SOURCE"
          echo "Branch: $KERNEL_BRANCH"
          echo "Requested device: $DEVICE"
          echo "LKM support: CONFIG_MODULES=y required"
          echo "Flashable ZIP: intentionally not generated"
          echo "Device boot compatibility: not established by compilation alone"
