
name: Singularity OnePlus 8 Pro Kernel Build

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"

permissions:
  contents: read

concurrency:
  group: singularity-instantnoodlep-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build instantnoodlep kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    env:
      KERNEL_SOURCE: https://github.com/The-Anomalist/Singularity.git
      KERNEL_BRANCH: event-horizon
      DEVICE: instantnoodlep
      KERNEL_OUT: ${{ github.workspace }}/kernel-out
      MODULE_STAGING: ${{ github.workspace }}/module-staging

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ca-certificates \
            clang-14 lld-14 llvm-14 \
            flex git libelf-dev libssl-dev \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            make pahole perl python3 python3-pip \
            rsync tar xz-utils zstd \
            device-tree-compiler cpio

      - name: Clone Singularity and initialize submodules
        run: |
          set -euo pipefail

          git clone \
            --depth=1 \
            --single-branch \
            --branch "$KERNEL_BRANCH" \
            --recurse-submodules \
            --shallow-submodules \
            "$KERNEL_SOURCE" kernel

          cd kernel

          echo "Source: $KERNEL_SOURCE"
          echo "Branch: $(git branch --show-current)"
          echo "Commit: $(git rev-parse HEAD)"

          git submodule status

          if [ "$(git branch --show-current)" != "$KERNEL_BRANCH" ]; then
            echo "::error::Unexpected kernel branch."
            exit 1
          fi

      - name: Verify and wire existing KernelSU-Next
        working-directory: kernel
        run: |
          set -euo pipefail

          KSU_ROOT="KernelSU-Next"
          KSU_KERNEL="$KSU_ROOT/kernel"

          echo "=== KernelSU-Next source ==="

          if [ ! -d "$KSU_ROOT" ]; then
            echo "::error::KernelSU-Next submodule directory is missing."
            git submodule status
            exit 1
          fi

          if [ ! -f "$KSU_KERNEL/Kconfig" ] ||
             [ ! -f "$KSU_KERNEL/Makefile" ]; then
            echo "::error::KernelSU-Next submodule is incomplete."
            find "$KSU_ROOT" -maxdepth 3 -type f \
              | head -100 || true
            exit 1
          fi

          echo "KernelSU source found at $KSU_KERNEL"

          echo "=== Driver integration ==="

          if [ ! -e drivers/kernelsu ]; then
            ln -s ../KernelSU-Next/kernel drivers/kernelsu
            echo "Created drivers/kernelsu symlink."
          elif [ -L drivers/kernelsu ]; then
            echo "Existing drivers/kernelsu symlink:"
            readlink drivers/kernelsu
          elif [ -d drivers/kernelsu ]; then
            echo "Existing drivers/kernelsu directory preserved."
          else
            echo "::error::drivers/kernelsu exists but is not a directory."
            exit 1
          fi

          if [ ! -f drivers/kernelsu/Kconfig ]; then
            echo "::error::drivers/kernelsu/Kconfig is unavailable."
            exit 1
          fi

          if ! grep -Fq 'kernelsu/' drivers/Makefile; then
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' \
              >> drivers/Makefile
          fi

          if ! grep -Fq 'source "drivers/kernelsu/Kconfig"' \
              drivers/Kconfig; then
            python3 - <<'PY'
          from pathlib import Path

          path = Path("drivers/Kconfig")
          text = path.read_text()
          entry = 'source "drivers/kernelsu/Kconfig"'

          if entry not in text:
              marker = "\nendmenu"
              index = text.rfind(marker)

              if index < 0:
                  raise SystemExit(
                      "Cannot safely add KernelSU Kconfig entry: "
                      "no endmenu marker was found."
                  )

              text = (
                  text[:index]
                  + "\n" + entry + "\n"
                  + text[index:]
              )
              path.write_text(text)
          PY
          fi

          echo "=== KernelSU integration verified ==="
          grep -n 'kernelsu' drivers/Makefile drivers/Kconfig

      - name: Audit existing SUSFS integration
        working-directory: kernel
        run: |
          set -euo pipefail

          echo "=== Existing SUSFS files ==="

          for path in \
            fs/susfs.c \
            include/linux/susfs.h \
            include/linux/susfs_def.h \
            drivers/kernelsu
          do
            if [ -e "$path" ]; then
              echo "Found: $path"
            fi
          done

          echo "=== SUSFS symbols ==="

          git grep -n -i -E \
            'CONFIG_.*SUSFS|susfs' \
            -- '*Kconfig*' '*Makefile*' \
               fs include/linux drivers \
            > ../susfs-audit.txt || true

          cat ../susfs-audit.txt || true

          echo "Audit only. No SUSFS patches will be reapplied."

      - name: Locate kernel defconfig
        id: config
        working-directory: kernel
        run: |
          set -euo pipefail

          candidates=(
            arch/arm64/configs/vendor/kona-perf_defconfig
            arch/arm64/configs/kona-perf_defconfig
            arch/arm64/configs/vendor/kona_defconfig
            arch/arm64/configs/kona_defconfig
            arch/arm64/configs/vendor/instantnoodlep_defconfig
            arch/arm64/configs/instantnoodlep_defconfig
          )

          selected=""

          for candidate in "${candidates[@]}"; do
            if [ -f "$candidate" ]; then
              selected="$candidate"
              break
            fi
          done

          if [ -z "$selected" ]; then
            echo "::error::No recognized Kona defconfig found."
            find arch/arm64/configs -type f \
              -name '*defconfig' | head -200
            exit 1
          fi

          echo "Selected defconfig: $selected"
          echo "defconfig=$selected" >> "$GITHUB_OUTPUT"

      - name: Configure kernel with LKM support
        working-directory: kernel
        env:
          DEFCONFIG: ${{ steps.config.outputs.defconfig }}
        run: |
          set -euo pipefail

          mkdir -p "$KERNEL_OUT"

          make O="$KERNEL_OUT" \
            ARCH=arm64 LLVM=-14 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            "$DEFCONFIG"

          scripts/config --file "$KERNEL_OUT/.config" \
            --enable MODULES \
            --enable KPROBES \
            --enable KALLSYMS \
            --enable KALLSYMS_ALL \
            --enable EXT4_FS \
            --enable KSU

          make O="$KERNEL_OUT" \
            ARCH=arm64 LLVM=-14 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

          cp "$KERNEL_OUT/.config" ../kernel-config.txt

          echo "=== Required configuration ==="

          grep -E \
            '^(CONFIG_MODULES|CONFIG_KPROBES|CONFIG_EXT4_FS|CONFIG_KSU|CONFIG_KALLSYMS)=' \
            "$KERNEL_OUT/.config" || true

          for option in MODULES KPROBES KSU; do
            if ! grep -qx "CONFIG_${option}=y" \
                "$KERNEL_OUT/.config"; then
              echo "::error::CONFIG_${option}=y is unavailable."
              echo "Check Kconfig dependencies and integration."
              exit 1
            fi
          done

      - name: Audit Qualcomm charger API
        working-directory: kernel
        run: |
          set -euo pipefail

          SRC="drivers/power/supply/qcom/schgm-flash.c"
          LIB="drivers/power/supply/qcom/smb5-lib.h"

          if [ ! -f "$SRC" ]; then
            echo "::error::Expected charger source is missing: $SRC"
            exit 1
          fi

          echo "=== Charger source includes ==="
          sed -n '1,140p' "$SRC"

          echo "=== Definitions and declarations ==="

          git grep -n -E \
            'struct smb_charger|struct smb_irq_data|smblib_read[[:space:]]*\(|smblib_write[[:space:]]*\(|smblib_masked_write[[:space:]]*\(' \
            -- drivers/power/supply/qcom \
            > ../charger-api-audit.txt || true

          cat ../charger-api-audit.txt || true

          if [ ! -f "$LIB" ]; then
            echo "::warning::smb5-lib.h not found at expected path."
            echo "The API audit has been saved."
            exit 0
          fi

          python3 - <<'PY'
          from pathlib import Path

          source = Path("drivers/power/supply/qcom/schgm-flash.c")
          text = source.read_text()

          wanted = '#include "smb5-lib.h"'
          target = '#include "schgm-flash.h"'

          if wanted not in text and target in text:
              text = text.replace(
                  target,
                  wanted + "\n" + target,
                  1
              )
              source.write_text(text)
              print("Added smb5-lib.h before schgm-flash.h.")
          else:
              print("No include-order change required.")
          PY

          echo "=== Updated includes ==="
          sed -n '1,100p' "$SRC"

      - name: Build kernel image, DTBs and modules
        working-directory: kernel
        run: |
          set -euo pipefail

          THREADS="$(nproc)"
          echo "Building with $THREADS jobs."

          make -j"$THREADS" \
            O="$KERNEL_OUT" \
            ARCH=arm64 \
            LLVM=-14 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image.gz dtbs modules \
            2>&1 | tee ../kernel-build.log

          echo "Kernel compilation completed."

      - name: Install compiled modules into staging
        if: success()
        working-directory: kernel
        run: |
          set -euo pipefail

          mkdir -p "$MODULE_STAGING"

          make O="$KERNEL_OUT" \
            ARCH=arm64 LLVM=-14 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            INSTALL_MOD_PATH="$MODULE_STAGING" \
            modules_install

          find "$MODULE_STAGING" -type f -name '*.ko' \
            -print | tee ../module-list.txt

      - name: Collect build artifacts and diagnostics
        if: always()
        run: |
          set -euo pipefail

          mkdir -p artifacts

          for file in \
            kernel-build.log \
            kernel-config.txt \
            charger-api-audit.txt \
            susfs-audit.txt \
            module-list.txt
          do
            if [ -f "$file" ]; then
              cp "$file" artifacts/
            fi
          done

          if [ -d kernel-out ]; then
            cp kernel-out/.config artifacts/kernel.config \
              2>/dev/null || true

            for image in \
              kernel-out/arch/arm64/boot/Image \
              kernel-out/arch/arm64/boot/Image.gz \
              kernel-out/arch/arm64/boot/Image.gz-dtb
            do
              if [ -f "$image" ]; then
                mkdir -p artifacts/boot
                cp "$image" artifacts/boot/
              fi
            done

            if [ -d kernel-out/arch/arm64/boot/dts ]; then
              tar -czf artifacts/device-trees.tar.gz \
                -C kernel-out/arch/arm64/boot dts
            fi

            find kernel-out -type f -name '*.ko' \
              -exec cp --parents '{}' artifacts/ \; \
              2>/dev/null || true
          fi

          if [ -d module-staging ]; then
            tar -czf artifacts/loadable-modules.tar.gz \
              -C module-staging .
          fi

          if [ -d kernel/.git ]; then
            echo "Kernel commit: $(git -C kernel rev-parse HEAD)" \
              > artifacts/build-summary.txt
          fi

          {
            echo "Branch: $KERNEL_BRANCH"
            echo "Device target: $DEVICE"
            echo "LKM support requested: CONFIG_MODULES=y"
            echo "SUSFS: no automatic patching"
            echo "Flashable ZIP: not generated"
            echo "Partition writes: none"
          } >> artifacts/build-summary.txt

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: singularity-instantnoodlep-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
